/* ============================================================
   LIBRARY PACK + BACKUP (v3)
   A library pack is one file made on the Mac (captions, creators, lengths and cover
   images for the whole library). Importing it fills this phone's own store, so the grid
   and search no longer wait on the network. Importing only ADDS: nothing already on the
   phone is replaced, so a newer pack can be imported any time.
   Layout: 'FAVPACK1' + uint32 (little-endian) length of the index + index JSON + cover bytes.
   Index: { v, made, items: [[id, creator, handle, caption, seconds, offset, length, gone], ...] }.
   ============================================================ */
function pickFile(cb) {
  const inp = document.getElementById('filePick');
  inp.value = ''; inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) cb(f); };
  inp.click();
}
function progressModal(title) {
  closeOverlays();
  const b = document.createElement('div'); b.className = 'modal-backdrop'; b.id = 'progModal';
  b.innerHTML = '<div class="modal-card"><div class="modal-title">' + esc(title) + '</div><div class="modal-message" id="progMsg">Reading the file…</div></div>';
  document.body.appendChild(b);
  return { set(t) { const m = b.querySelector('#progMsg'); if (m) m.textContent = t; }, close() { b.remove(); } };
}
async function importPack(file, onProgress) {
  const head = new DataView(await file.slice(0, 12).arrayBuffer());
  let magic = ''; for (let i = 0; i < 8; i++) magic += String.fromCharCode(head.getUint8(i));
  if (magic !== 'FAVPACK1') throw new Error('this is not a library pack');
  const n = head.getUint32(8, true), base = 12 + n;
  const idx = JSON.parse(await file.slice(12, base).text());
  const rows = idx.items || []; let metaN = 0, goneN = 0, covN = 0;
  await Promise.all([metaReady, thumbReady, LIB.ready]);
  rows.forEach(r => {
    const id = String(r[0]);
    if (r[7]) { if (!LIB.has(id) && !cacheGet(id) && !isGone(id)) { thumbCache[id] = { gone: true, t: Date.now() }; goneN++; } return; }
    const cur = metaStore[id];
    if (!(r[1] || r[2] || r[3])) return;
    if (!cur || (!cur.desc && r[3]) || (!cur.author && r[1]) || (r[4] && !cur.dur) || (r[8] && !cur.img)) {
      const next = { author: (cur && cur.author) || r[1] || '', handle: (cur && cur.handle) || r[2] || '', desc: (cur && cur.desc) ? cur.desc : (r[3] || '') };
      if (r[4]) next.dur = r[4];
      if (r[8] || (cur && cur.img)) next.img = r[8] || cur.img;
      metaStore[id] = next; metaN++;
    }
  });
  cacheDirty = true; metaDirty = true;
  const withCover = rows.filter(r => r[6] > 0 && !r[7]);
  const need = withCover.filter(r => !LIB.has(r[0])).sort((a, b) => a[5] - b[5]);
  for (let i = 0; i < need.length; i += 150) {
    const part = need.slice(i, i + 150), from = part[0][5], last = part[part.length - 1];
    const buf = await file.slice(base + from, base + last[5] + last[6]).arrayBuffer();
    await LIB.putCovers(part.map(r => [String(r[0]), buf.slice(r[5] - from, r[5] - from + r[6])]));
    covN += part.length; if (onProgress) onProgress(covN, need.length);
    await new Promise(r => setTimeout(r, 0));
  }
  await flushTracked('meta', _metaTS, 'meta'); await flushTracked('thumb', _thumbTS, 'thumb-cache');
  return { videos: rows.length, captions: metaN, covers: covN, coversAlready: withCover.length - need.length, gone: goneN, made: idx.made || 0 };
}
function runPackImport(file) {
  const pm = progressModal('Importing library pack');
  importPack(file, (a, b) => pm.set('Cover images: ' + a + ' of ' + b)).then(r => {
    pm.close();
    infoModal('Library pack imported', r.videos + ' videos in the pack\n' + r.covers + ' cover images added (' + r.coversAlready + ' were already here)\n' +
      r.captions + ' captions added\n' + r.gone + ' marked unavailable');
    if (document.getElementById('gridView').classList.contains('open')) gridVL.setItems(gridList, gridVL.rowH);
  }).catch(e => { pm.close(); toast('Import failed: ' + ((e && e.message) || 'could not read the file')); });
}
// Backup file = the organizing work only (categories, which video is where, deletions).
async function exportBackup() {
  flushSave(true);
  const name = 'favorites-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([JSON.stringify({ kind: 'favorites-backup', v: 1, at: new Date().toISOString(), app: APP_VERSION, state, x: X, shuffle: SH })], name, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Backup file saved');
}
function readBackup(text) {
  let j = null; try { j = JSON.parse(text); } catch (e) {}
  const st = j && j.kind === 'favorites-backup' ? j.state : null;
  if (!st || !Array.isArray(st.items) || !Array.isArray(st.categories) || !st.items.every(i => i && i.id)) return null;
  return { at: j.at, state: st, x: (j.x && typeof j.x === 'object') ? j.x : null, shuffle: (j.shuffle && typeof j.shuffle === 'object') ? j.shuffle : null };
}
function applyBackup(st, x, sh) {
  LIB.putSnapAs('before-import', JSON.stringify(state));      // undo copy of what was here
  LIB.putSnapAs('before-import-x', JSON.stringify(X));
  st.version = DATA_VERSION; st.hydrated = true; st.purged = st.purged || [];
  state = st; flushSave(true);
  if (x) { X = x; normX(); saveX(); }                         // a backup from before v9 has none: keep what is here
  if (sh) { SH = sh; normSH(); saveSH(true); }
  renderHome();
}
function importBackup(file) {
  file.text().then(t => {
    const b = readBackup(t);
    if (!b) { toast('That is not a Favorites backup file'); return; }
    const st = b.state;
    const cats = st.categories.filter(c => c !== DELETED && c !== 'Uncategorized').length;
    const filed = st.items.filter(i => i.category && i.category !== 'Uncategorized' && i.category !== DELETED).length;
    confirmModal({ title: 'Replace with this backup?', confirmLabel: 'Replace', destructive: true,
      message: 'Backup from ' + formatDate(b.at) + ': ' + st.items.length + ' videos, ' + cats + ' categories, ' + filed + ' videos filed. What is on this phone now is kept as an undo copy.',
      onConfirm: () => { applyBackup(st, b.x, b.shuffle); toast('Backup restored'); } });
  }).catch(() => toast('Could not read that file'));
}
/* ---- v13: import a list of links (a whole message thread gathered on the Mac, or pasted text) ----
   File made by _dev/tools/thread_import.py: { kind:'favorites-import', from:'Sam', items:[{url}] };
   plain text with links in it works too. Rules (SPEC): videos already here are skipped (they only
   get the sender label if they had none), videos deleted for good are never brought back, short
   links are expanded through the resolver one at a time, Instagram links are counted and left out. */
function parseImport(text) {
  let from = '', raw = [];
  try { const j = JSON.parse(text); const arr = Array.isArray(j) ? j : (j && Array.isArray(j.items) ? j.items : null);
    if (arr) { from = (j && typeof j.from === 'string') ? j.from.trim().slice(0, 40) : ''; raw = arr.map(e => typeof e === 'string' ? e : String((e && (e.url || e.id)) || '')); } } catch (e) {}
  if (!raw.length) { const m = /^\s*from:\s*(.+)$/im.exec(text); if (m) from = m[1].trim().slice(0, 40); raw = text.match(/https?:\/\/[^\s"'<>]+|\b\d{17,20}\b/g) || []; }
  const ids = [], shorts = []; let ig = 0, bad = 0; const seen = new Set();
  raw.forEach(u => {
    u = String(u).trim(); if (!u || seen.has(u)) return; seen.add(u);
    let m = /(?:\/video\/|\/photo\/|\/v\/)(\d{15,20})/.exec(u) || /^(\d{15,20})$/.exec(u);
    if (m) { if (!ids.includes(m[1])) ids.push(m[1]); return; }
    if (/^https?:\/\/(vm|vt)\.tiktok\.com\/\w+|^https?:\/\/(www\.)?tiktok\.com\/t\/\w+/i.test(u)) { shorts.push(u.replace(/[).,]+$/, '')); return; }
    if (/instagram\.com\/(reel|reels|p|tv)\//i.test(u)) { ig++; return; }
    if (/tiktok/i.test(u)) bad++;
  });
  return { from, ids, shorts, ig, bad };
}
async function runImport(p, onProgress) {
  const res = { added: 0, already: 0, deletedForGood: 0, unreadable: p.bad, instagram: p.ig, labelled: 0, from: p.from };
  const ids = p.ids.slice();
  for (let i = 0; i < p.shorts.length; i++) {                 // short links: ask the resolver, politely
    if (onProgress) onProgress('Reading short link ' + (i + 1) + ' of ' + p.shorts.length);
    const wait = MIN_GAP - (Date.now() - _lastRes); if (wait > 0) await new Promise(r => setTimeout(r, wait)); _lastRes = Date.now();
    try { const j = await (await fetch(RESOLVER + encodeURIComponent(p.shorts[i]))).json(); const vid = j && j.code === 0 && j.data && j.data.id ? String(j.data.id) : '';
      if (vid) { if (j.data.author) metaSet(vid, { author: j.data.author.nickname || '', handle: j.data.author.unique_id || '', desc: j.data.title || '' }); if (!ids.includes(vid)) ids.push(vid); } else res.unreadable++; }
    catch (e) { res.unreadable++; }
  }
  const have = new Map(state.items.map(i => [i.id, i])), purged = new Set(state.purged || []), now = new Date().toISOString().replace('T', ' ').slice(0, 19), fresh = [];
  ids.forEach(id => {
    if (purged.has(id)) { res.deletedForGood++; return; }
    if (have.has(id)) { res.already++; if (p.from && !X.from[id]) { X.from[id] = p.from; res.labelled++; } return; }
    fresh.push({ id, date: now, category: SHARED_CAT }); if (p.from) X.from[id] = p.from; res.added++;
  });
  if (fresh.length) { state.items = fresh.concat(state.items); if (!state.categories.includes(SHARED_CAT)) state.categories.unshift(SHARED_CAT); }
  if (res.added || res.labelled) { flushSave(true); saveX(); renderHome(); }
  return res;
}
function importList(text) {
  const p = parseImport(text);
  if (!p.ids.length && !p.shorts.length) { toast(p.ig ? 'Only Instagram links in there; those are not supported yet' : 'No TikTok links found in that'); return; }
  const pm = progressModal('Importing links'); pm.set((p.ids.length + p.shorts.length) + ' links found…');
  runImport(p, t => pm.set(t)).then(r => { pm.close();
    infoModal('Links imported' + (r.from ? ' from ' + r.from : ''), 'Added to “Shared with me”: ' + r.added + '\nAlready in your library: ' + r.already + (r.labelled ? ' (' + r.labelled + ' now marked as sent by ' + r.from + ')' : '') +
      (r.deletedForGood ? '\nDeleted for good earlier, left out: ' + r.deletedForGood : '') + (r.instagram ? '\nInstagram links, not supported yet: ' + r.instagram : '') + (r.unreadable ? '\nCould not be read: ' + r.unreadable : '')); })
    .catch(() => { pm.close(); toast('Import failed'); });
}

/* ---- v5: automatic library ----
   The Mac publishes the harvested library on the site as ENCRYPTED parts (lib/manifest.json +
   lib/*.bin, AES-256-GCM). The key comes from a 16-digit code typed here once. With a key, the
   app fetches any part it has not imported yet, unlocks it and feeds it to importPack(), in
   the background, never while a video is on screen, and again whenever new parts appear. */
const LIBSYNC = (() => {
  const KEY = 'lib-key', DONE = 'lib-parts';
  let running = false, status = '', lastRun = 0, available = false;
  const b64 = (t) => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const doneList = () => { try { return JSON.parse(localStorage.getItem(DONE) || '[]'); } catch (e) { return []; } };
  const hasKey = () => { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } };
  const feedOpen = () => document.getElementById('feed').classList.contains('open');
  function paint() {
    const b = document.getElementById('libBtn'); if (!b) return;
    b.textContent = 'Library & backup' + (status ? '  ·  ' + status : (available && !hasKey() ? '  ·  enter code to load every thumbnail' : ''));
  }
  async function manifest() { const r = await fetch('lib/manifest.json?t=' + Date.now(), { cache: 'no-store' }); return r.ok ? r.json() : null; }
  const importKey = (raw) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const unlock = (key, buf) => { const u = new Uint8Array(buf); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, key, u.subarray(12)); };
  async function setCode(code) {                // '' when accepted, otherwise what went wrong
    code = String(code).replace(/\D/g, ''); if (code.length < 12) return 'Enter the whole code.';
    if (!(window.crypto && crypto.subtle)) return 'This page cannot unlock the library here.';
    const m = await manifest().catch(() => null); if (!m) return 'No library is published yet.';
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
    const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(m.salt), iterations: m.iter }, base, 256));
    try { const t = await unlock(await importKey(raw), b64(m.check).buffer); if (new TextDecoder().decode(t) !== 'favlib-ok') throw 0; } catch (e) { return 'That code does not match.'; }
    localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, raw)));
    run(); return '';
  }
  async function run() {
    if (running || !hasKey() || !(window.crypto && crypto.subtle)) return;
    running = true; lastRun = Date.now();
    try {
      const m = await manifest(); if (!m) return;
      const key = await importKey(b64(localStorage.getItem(KEY)));
      let have = doneList(); const todo = m.parts.filter(p => !have.includes(p.f));
      for (let i = 0; i < todo.length; i++) {
        while (feedOpen()) await new Promise(r => setTimeout(r, 2000));       // never compete with a video on screen
        status = 'loading library, part ' + (m.parts.length - todo.length + i + 1) + ' of ' + m.parts.length; paint();
        const r = await fetch('lib/' + todo[i].f); if (!r.ok) throw new Error('part unavailable');
        await importPack(new Blob([await unlock(key, await r.arrayBuffer())]));
        have = doneList(); have.push(todo[i].f); localStorage.setItem(DONE, JSON.stringify(have));
        if (document.getElementById('gridView').classList.contains('open') && !feedOpen()) gridVL.setItems(gridList, gridVL.rowH);
      }
      status = '';
    } catch (e) { status = 'library paused, will retry'; setTimeout(run, 60000); }
    finally { running = false; paint(); }
  }
  async function start() {
    if (hasKey()) { run(); return; }
    try { available = !!(await manifest()); } catch (e) {} paint();
  }
  setTimeout(start, 2500);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && hasKey() && Date.now() - lastRun > 600000) run(); });
  return { setCode, run, hasKey, state: () => ({ running, status, parts: doneList().length, key: hasKey(), available }) };
})();
function askLibraryCode() {
  inputModal({ title: 'Library code', placeholder: '16 digits', confirmLabel: 'Load',
    onSubmit: (val) => { toast('Checking the code…'); LIBSYNC.setCode(val).then(err => toast(err || 'Library is loading in the background')); } });
  const inp = document.getElementById('modalInput'); if (inp) { inp.setAttribute('inputmode', 'numeric'); inp.setAttribute('autocomplete', 'off'); }
}
document.getElementById('libBtn').onclick = () => {
  const st = LIBSYNC.state();

    st.key ? { label: 'Automatic library: on (' + st.parts + ' parts loaded)', onClick: () => { LIBSYNC.run(); toast('Checking for new library parts'); } }

    { label: 'Import a list of links (file)', onClick: () => pickFile(f => f.text().then(importList).catch(() => toast('Could not read that file'))) },
    { label: 'Paste links', onClick: () => inputModal({ title: 'Paste links', placeholder: 'One or many TikTok links', confirmLabel: 'Import', onSubmit: (v) => { setTimeout(() => importList(v), 60); } }) },

/* ---- v10: keep a copy (Ian, Nov 15 2026: for videos he wants to preserve long term) ----
   Only ever on his explicit action for one video: the app never downloads video by itself.
   Step 1 fetches the file (video, or every picture of a photo post) into memory with a
   progress line. Step 2 is a second tap, because iOS opens its share sheet only straight
   from a tap: from there "Save Video" puts it in Photos, "Save to Files" in Files. */
async function saveCopy(item) {
  const id = item.id, pm = progressModal('Saving a copy'); pm.set('Getting the video…');
  try {
    const r = await requestResolve(id, 0); const m = metaStore[id] || {};
    const base = ((m.handle || 'video') + '-' + id).replace(/[^\w.-]+/g, '_'); let files = [], bytes = 0;
    const pull = async (url, label) => {
      const res = await fetch(url, { referrerPolicy: 'no-referrer', credentials: 'omit' }); if (!res.ok) throw new Error('the server refused');
      const total = Number(res.headers.get('content-length')) || 0;
      if (!(res.body && res.body.getReader)) { const b = await res.blob(); bytes += b.size; return b; }
      const rd = res.body.getReader(), parts = []; let got = 0;
      for (;;) { const x = await rd.read(); if (x.done) break; parts.push(x.value); got += x.value.length; pm.set(label + (total ? Math.round(got / total * 100) + '% of ' + (total / 1e6).toFixed(1) + ' MB' : (got / 1e6).toFixed(1) + ' MB')); }
      bytes += got; return new Blob(parts);
    };
    if (r.images && r.images.length) {
      for (let i = 0; i < r.images.length; i++) files.push(new File([await pull(r.images[i], 'Picture ' + (i + 1) + ' of ' + r.images.length + ': ')], base + '-' + String(i + 1).padStart(2, '0') + '.jpg', { type: 'image/jpeg' }));
    } else files.push(new File([await pull(r.play, '')], base + '.mp4', { type: 'video/mp4' }));
    pm.close(); saveReady(item, files, bytes);
  } catch (e) { pm.close(); toast('Could not save a copy: ' + ((e && e.message) || 'no connection')); }
}
function saveReady(item, files, bytes) {
  closeOverlays();
  const b = document.createElement('div'); b.className = 'modal-backdrop'; b.id = 'saveModal';
  b.innerHTML = '<div class="modal-card"><div class="modal-title">Copy ready</div><div class="modal-message">' + (files.length > 1 ? files.length + ' pictures' : 'Video') + ', ' + (bytes / 1e6).toFixed(1) +
    ' MB. Tap Save, then choose “Save Video” (Photos) or “Save to Files”.</div><div class="modal-actions"><button class="modal-btn" id="modalCancel">Cancel</button><button class="modal-btn primary" id="saveGo">Save</button></div></div>';
  document.body.appendChild(b);
  b.querySelector('#modalCancel').onclick = closeOverlays;
  const done = () => { X.saved[item.id] = Date.now(); saveX(); closeOverlays(); toast('Saved');
    document.querySelectorAll('.slide[data-id="' + CSS.escape(item.id) + '"] .slide-cat').forEach(c => { c.textContent = catLine(item); }); };
  b.querySelector('#saveGo').onclick = () => {
    if (navigator.canShare && navigator.canShare({ files })) { navigator.share({ files }).then(done).catch(e => { if (!e || e.name !== 'AbortError') toast('The phone did not open the save sheet'); }); return; }
    files.forEach(f => { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); });   // browsers without file sharing (a computer)
    done();
  };
}

// Per-video lifecycle recorder. Each entry is timestamped from the moment the
// slide became current, so a single screenshot of the overlay after a failing
// swipe shows exactly where playback stalled: whether the player never handshook
// (no "ready"), handshook then got an autoplay error (ERR:3002), or reached
// buffering (state:3) but never playing (state:1). Always records; the overlay
// just reveals it.
function diag(el, msg) {
  if (!el) return;
  if (!el._diag) el._diag = [];
  const t = el._becameCurrentAt ? (Date.now() - el._becameCurrentAt) : 0;
  el._diag.push(t + 'ms ' + msg);
  if (el._diag.length > 30) el._diag.shift();
  renderDiag();
}
function renderDiag() {
  const box = document.getElementById('debugLog');
  if (!box || !DEBUG) return;
  const el = slotEls['0'];
  if (!el) { box.textContent = '(no current video)'; return; }
  const id = el.dataset.id || '?';
  const st = el._state === undefined || el._state === null ? '—' : el._state;
  const stName = ({1:'PLAYING',2:'paused',3:'buffering',0:'ended'})[el._state] || 'no-handshake';
  const v = el._vid || null;
  const header =
    'video …' + id.slice(-8) + '   idx ' + curIndex + '/' + (feedList.length - 1) + '\n' +
    'state ' + st + ' (' + stName + ')   vid:' + (v ? 'yes' : 'NO') +
    '   vmuted:' + (v ? v.muted : '?') + '   want:' + (desiredMuted ? 'muted' : 'sound') + '\n' +
    '─────────────\n';
  box.textContent = header + (el._diag || []).join('\n');
}
document.getElementById('debugToggle').onclick = () => {
  DEBUG = !DEBUG;
  document.getElementById('debugLog').classList.toggle('show', DEBUG);
  if (DEBUG) renderDiag();
};

/* ---- keep the grid virtual list correct across rotation / resize ---- */
window.addEventListener('resize', () => {
  if (document.getElementById('gridView').classList.contains('open')) {
    gridVL.setItems(gridList, gridRowHeight());
    gridScroll.scrollTop = gridScrollMemory[gridLabel] || 0;
    gridVL.update(true);
  }
});

/* ---- test telemetry (off unless ?telemetry=<url>; only localhost / .local / LAN / same origin) ---- */
const TELEMETRY = (() => {
  try {
    const raw = new URLSearchParams(location.search).get('telemetry'); if (!raw) return null;
    const u = new URL(raw, location.href), h = u.hostname;
    const ok = u.origin === location.origin || h === 'localhost' || h === '127.0.0.1' || h === '[::1]' ||
      h.endsWith('.local') || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
    return ok ? u.href : null;
  } catch (e) { return null; }
})();
let _tq = [], _tt = null;
function tlog(evt, data) {
  if (!TELEMETRY) return;
  _tq.push(Object.assign({ t: Math.round(performance.now()), wall: Date.now(), evt, idx: curIndex,
    cur: slotEls['0'] ? slotEls['0'].dataset.id : null }, data || {}));
  if (!_tt) _tt = setTimeout(() => { _tt = null; const body = JSON.stringify(_tq); _tq = [];
    try { fetch(TELEMETRY, { method: 'POST', body, keepalive: true, headers: { 'Content-Type': 'text/plain' } }).catch(() => {}); } catch (e) {} }, 250);
}
if (TELEMETRY) {
  ['playing', 'waiting', 'pause', 'error', 'volumechange'].forEach(type => document.addEventListener(type, e => {
    const v = e.target; if (!(v instanceof HTMLVideoElement)) return; const el = v.closest('.slide');
    tlog('v-' + type, { vid: el ? el.dataset.id : null, current: el === slotEls['0'], muted: v.muted, t: Math.round(v.currentTime * 100) / 100 });
  }, true));
}

/* ---- automation hooks for the test runners (harmless in normal use) ---- */
window.__fav = {
  version: 'app-v' + APP_VERSION,
  open(i) { openFeed(liveItems(), 'All Videos', i || 0); tlog('open', { start: i || 0 }); return true; },
  go(dir) {
    if (animating || dragging) return false;
    const ni = curIndex + dir; if (ni < 0 || ni >= feedList.length) return false;
    animating = true; startIncoming(dir); setTrack(dir > 0 ? -stageHeight() : stageHeight(), true);
    afterTransition(() => { animating = false; commitAdvance(dir); tlog('commit', { dir, to: curIndex }); });
    return true;
  },
  next() { return this.go(1); },
  prev() { return this.go(-1); },
  setSound(on) { desiredMuted = !on; return !desiredMuted; },
  snap() {
    const el = slotEls['0']; if (!el) return null;
    const v = el.querySelector('video'), m = el.querySelector('.slide-media');
    return { idx: curIndex, id: el.dataset.id, state: el._state == null ? null : el._state,
      muted: v ? v.muted : null, paused: v ? v.paused : null, ready: v ? v.readyState : null,
      t: v ? Math.round(v.currentTime * 100) / 100 : null, desiredMuted,
      revealed: !!(m && m.classList.contains('is-playing')), needsTap: !!(m && m.classList.contains('needs-tap')),
      videos: document.querySelectorAll('video').length };
  },
  async storage() {
    let ls = 0; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); ls += k.length + (localStorage.getItem(k) || '').length; }
    const out = { localStorageChars: ls, idbOk: KV.ok, covers: LIB.count(), coverFailures: LIB.failed(), resolverInFlight: _flying.size };
    if (KV.ok) for (const s of ['thumb', 'meta', 'rv']) { try { out['idb_' + s] = await KV.count(s); } catch (e) { out['idb_' + s] = -1; } }
    return out;
  },
  ready() { return Promise.all([metaReady, thumbReady]); },
  libsync: LIBSYNC, health: HEALTH
};

boot();
</script>
<script>
/* ---- Version badge + auto-update (Nov 15 2026; replaces per-build NATO filenames) ----
   One address for the app. On open, on return to the app and every minute, it asks for
   version.json with caching disabled; if a newer version exists it reloads itself at a
   fresh URL (?v=N, which no cache has seen). Never mid-video: while the feed is open the
   reload waits until the feed closes. A per-tab guard stops reload loops if a CDN still
   serves the old page. APP_VERSION / APP_BUILT are stamped by _dev/tools/release.py. */
(function () {
  const badge = document.getElementById('verBadge');
  const tag = document.getElementById('verTag');
  const show = (extra) => { if (badge) badge.textContent = 'v' + APP_VERSION + ' · ' + APP_BUILT + (extra || ''); if (tag) tag.textContent = 'v' + APP_VERSION + (extra ? ' *' : ''); };
  show();
  let pendingV = null;
  const feedOpen = () => { const f = document.getElementById('feed'); return !!(f && f.classList.contains('open')); };
  function go(v) {
    let tried = null; try { tried = sessionStorage.getItem('upd-tried'); } catch (e) {}
    if (tried === String(v)) { show(' · v' + v + ' pending'); return; }
    try { sessionStorage.setItem('upd-tried', String(v)); } catch (e) {}
    try { if (typeof flushSave === 'function') flushSave(); } catch (e) {}
    try { if (document.getElementById('gridView').classList.contains('open')) sessionStorage.setItem('resume-grid', JSON.stringify({ label: gridLabel, scroll: gridScroll.scrollTop })); } catch (e) {}
    const q = new URLSearchParams(location.search); q.set('v', v);
    location.replace(location.pathname + '?' + q.toString());
  }
  async function check() {
    if (document.hidden) return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const v = Number((await r.json()).v);
      if (!(v > APP_VERSION)) return;
      if (feedOpen()) { pendingV = v; return; }
      go(v);
    } catch (e) {}
  }
  window.__appUpdate = { check, version: () => APP_VERSION };
  check();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setInterval(check, 60000);
  setInterval(() => { if (pendingV && !feedOpen()) { const v = pendingV; pendingV = null; go(v); } }, 1500);
})();
</script>
