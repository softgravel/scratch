<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Favorites">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://www.tikwm.com" crossorigin>
<link rel="dns-prefetch" href="https://v16m.tiktokcdn-us.com">
<link rel="dns-prefetch" href="https://p16-common-sign.tiktokcdn-us.com">
<title>Favorites</title>
<style>
  :root {
    --bg:#000; --panel:#151515; --line:#242424;
    --text:#f2f2f2; --dim:#8a8a8a; --accent:#3b7dd8;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    overscroll-behavior:none;
  }
  button { font:inherit; color:inherit; }
  /* v4: a long press must never start text selection, the magnifier or the image menu */
  #home, #gridView, #feed { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #gridView img, #feed img { -webkit-user-drag:none; }
  /* v7: one-line notice when something outside the app is broken (tap to dismiss) */
  #notice { position:fixed; left:10px; right:10px; top:calc(env(safe-area-inset-top) + 60px); z-index:58;   /* below the row of buttons, never over Back */ display:none; background:#3a2c10; color:#ffd78a;
    border:1px solid #6b5220; border-radius:10px; padding:8px 12px; font-size:12px; line-height:1.35; box-shadow:0 2px 10px rgba(0,0,0,.5); }
  #notice.show { display:block; }
  #verTag { position:fixed; right:6px; bottom:calc(env(safe-area-inset-bottom) + 2px); z-index:60; font-size:9px;
    color:rgba(255,255,255,.4); pointer-events:none; letter-spacing:.03em; text-shadow:0 0 2px rgba(0,0,0,.8); }

  /* ===================== HOME ===================== */
  #verBadge { margin-top:22px; text-align:center; font-size:11px; color:#666; letter-spacing:.02em; }
  #libBtn { display:block; margin:10px auto 0; background:none; border:0; color:#777; font-size:12px; padding:8px 12px; text-decoration:underline; }
  #filePick { position:fixed; left:-9999px; top:0; width:1px; height:1px; opacity:0; }
  #home { padding:max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom)); }
  #allTile {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; margin-bottom:14px;
  }
  #shuffleTile { background:linear-gradient(135deg,#1d2f4d,#16202f); border:1px solid #2b4168; border-radius:14px; padding:18px 16px; margin-bottom:14px; }
  #shuffleTile .name { font-size:17px; font-weight:600; }
  #shuffleTile .count { font-size:13px; color:#9fb4d6; margin-top:3px; }
  #shuffleBar { display:none; flex:1; justify-content:center; gap:6px; }
  #shuffleBar.open { display:flex; }
  #shuffleBar button { font-size:12px; font-weight:600; padding:6px 11px; border-radius:14px; border:0; background:rgba(0,0,0,.4); color:rgba(255,255,255,.8); }
  #shuffleBar button.on { background:rgba(255,255,255,.92); color:#000; }
  #allTile .name { font-size:17px; font-weight:600; }
  #allTile .count { font-size:13px; color:var(--dim); margin-top:3px; }
  #addLinkBtn {
    width:100%; margin-bottom:14px; padding:12px 16px; border-radius:12px;
    border:1px dashed var(--line); background:transparent; color:var(--accent);
    font-size:14px; font-weight:600; text-align:left;
  }
  #catGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat-tile {
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:16px 14px; min-height:78px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .cat-tile .name { font-size:15px; font-weight:600; padding-right:22px; word-break:break-word; }
  .cat-tile .count { font-size:12px; color:var(--dim); margin-top:6px; }
  .cat-tile.add { align-items:center; justify-content:center; color:var(--dim); border-style:dashed; }
  .cat-tile.trash { opacity:.72; }
  .cat-manage {
    position:absolute; top:6px; right:6px; background:none; border:0;
    color:var(--dim); font-size:16px; line-height:1; padding:6px 8px;
  }

  /* ===================== GRID ===================== */
  #gridView { position:fixed; inset:0; background:#000; display:none; flex-direction:column; z-index:15; }
  #gridView.open { display:flex; }
  .grid-top {
    display:flex; align-items:center; gap:10px;
    padding:max(14px,env(safe-area-inset-top)) 12px 8px;
  }
  .grid-title { font-size:15px; font-weight:600; flex:1; }
  .icon-btn {
    width:32px; height:32px; border-radius:50%; border:0;
    background:rgba(255,255,255,0.09); color:var(--text); font-size:15px; line-height:1;
  }
  #searchRow { display:none; align-items:center; gap:8px; padding:0 12px 8px; }
  #searchRow.open { display:flex; }
  /* v9: chips (people under "Shared with me"; the who-sent-it picker) */
  .chip { flex:0 0 auto; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:16px; padding:7px 13px; font-size:14px; }
  .chip.on { background:var(--accent); border-color:var(--accent); }
  .chip-row { display:none; gap:8px; padding:0 12px 8px; overflow-x:auto; white-space:nowrap; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar { display:none; }
  .chip-row.open { display:flex; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 6px; max-height:36vh; overflow-y:auto; }
  .sender-top { display:flex; gap:12px; align-items:center; }
  .sender-thumb { position:relative; flex:0 0 54px; height:84px; border-radius:8px; overflow:hidden; background:linear-gradient(160deg,#232323,#111); }
  .sender-thumb img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .15s; }
  .sender-thumb img.loaded { opacity:1; }
  #searchInput {
    flex:1; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:15px; padding:0 12px; outline:none;
  }
  #searchClear { width:34px; height:34px; border-radius:50%; border:0; background:rgba(255,255,255,.09); color:var(--text); font-size:18px; }
  #gridScroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  /* Virtualized: the container is sized to the whole library, but only the
     visible tiles exist in the DOM. */
  #thumbGrid { position:relative; width:100%; }
  .thumb-tile {
    position:absolute; overflow:hidden;
    background:linear-gradient(160deg,#232323,#111);
  }
  .thumb-tile img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .18s ease;
  }
  .thumb-tile img.loaded { opacity:1; }
  .thumb-date {
    position:absolute; left:4px; bottom:4px; font-size:9px;
    color:rgba(255,255,255,.75); background:rgba(0,0,0,.45);
    padding:1px 4px; border-radius:3px;
  }
  .thumb-tile.unavailable::after {
    content:'Unavailable'; position:absolute; top:6px; left:6px;
    font-size:9px; color:rgba(255,255,255,.6); background:rgba(0,0,0,.55);
    padding:2px 5px; border-radius:3px;
  }
  #gridEmpty { padding:40px 20px; text-align:center; color:var(--dim); font-size:14px; display:none; }

  /* date jump */
  #datePanel {
    position:absolute; left:0; right:0; bottom:0; background:#161616;
    border-top:1px solid var(--line); max-height:55vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .22s ease; z-index:16;
    padding-bottom:max(16px,env(safe-area-inset-bottom));
  }
  #datePanel.open { transform:translateY(0); }
  .date-panel-inner { padding:8px 12px; }
  .date-year-hdr {
    font-size:13px; font-weight:700; color:var(--accent);
    padding:12px 4px 6px; position:sticky; top:0; background:#161616;
  }
  .date-month-row {
    display:inline-flex; margin:3px; padding:7px 12px; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; font-size:13px;
  }

  /* ===================== FEED ===================== */
  #feed { position:fixed; inset:0; background:#000; display:none; flex-direction:column; z-index:20; }
  #feed.open { display:flex; }
  .feed-top {
    position:absolute; top:0; left:0; right:0; z-index:8;
    display:flex; align-items:center; gap:10px;
    padding:max(12px,env(safe-area-inset-top)) 12px 8px;
    background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
  }
  .feed-label {
    flex:1; font-size:13px; font-weight:600; text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  /* No native scroll anywhere in the feed. The stage is a fixed viewport and the
     track holds exactly three slides (prev / current / next) that we move with a
     CSS transform in response to swipe gestures. This eliminates the entire class
     of native-scroll + scroll-snap + momentum bugs. */
  #stage { position:absolute; inset:0; overflow:hidden; touch-action:none; background:#000; }
  #track { position:absolute; left:0; top:0; width:100%; will-change:transform; }
  /* The cross-origin iframe would swallow all touches, so it never receives
     pointer events — we drive play/pause ourselves and capture every gesture on
     the stage. The rail buttons (z-index 7) stay interactive above everything. */
  .slide-media iframe { pointer-events:none; }
  .slide {
    position:absolute; left:0; width:100%; overflow:hidden;
  }
  .slide-media { position:absolute; inset:0; background:#0b0b0b; }
  /* Thumbnail sits ABOVE the iframe (z-index 2 vs 1) until the video is
     confirmed playing. On devices where autoplay is blocked this means the
     slide shows its thumbnail, never a black frame; once playing, .is-playing
     fades the thumbnail out to reveal the video underneath. */
  .slide-media img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .06s linear; z-index:2;
  }
  .slide-media img.loaded { opacity:1; }
  /* v4: the stored grid thumbnail is a small 3:4 crop; as a full-screen start frame it is shown
     blurred until the full-frame poster (or the video itself) takes over */
  .slide-media img.lowres { filter:blur(14px); transform:scale(1.12); }
  /* v6: photo posts (slideshows): pictures side by side, swiped sideways, with the post's sound */
  .photos { position:absolute; inset:0; z-index:2; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
    touch-action:pan-x; -webkit-overflow-scrolling:touch; scrollbar-width:none; background:#000; }
  .photos::-webkit-scrollbar { display:none; }
  .slide-media .photos img { position:relative; inset:auto; flex:0 0 100%; width:100%; height:100%; object-fit:contain; opacity:1 !important;
    scroll-snap-align:center; scroll-snap-stop:always; filter:none; transform:none; transition:none; }
  .photo-count { position:absolute; top:calc(env(safe-area-inset-top) + 54px); left:50%; transform:translateX(-50%); z-index:6; font-size:12px; font-weight:600;
    background:rgba(0,0,0,.45); padding:3px 10px; border-radius:12px; pointer-events:none; }
  .thumb-photos { position:absolute; right:4px; top:4px; font-size:9px; color:#fff; background:rgba(0,0,0,.55); padding:1px 5px; border-radius:3px; }
  /* v4: progress / scrub bar along the bottom of every video */
  .scrub { position:absolute; left:0; right:0; bottom:max(2px,calc(env(safe-area-inset-bottom) - 12px)); height:30px; z-index:8; touch-action:none; }
  .scrub-track { position:absolute; left:10px; right:10px; bottom:9px; height:2px; border-radius:3px; background:rgba(255,255,255,.26); overflow:hidden; transition:height .12s ease, bottom .12s ease; }
  .scrub-fill { height:100%; width:0; background:rgba(255,255,255,.9); border-radius:3px; }
  .scrub.active .scrub-track { height:8px; bottom:6px; }
  .scrub-time { display:none; position:absolute; left:0; right:0; bottom:54px; text-align:center; font-size:24px; font-weight:700; text-shadow:0 1px 6px rgba(0,0,0,.8); pointer-events:none; }
  .scrub-time span { opacity:.6; font-weight:600; }
  .scrub.active .scrub-time { display:block; }
  .slide.scrubbing .slide-overlay, .slide.scrubbing .rail { opacity:0; }
  .slide-media.resolving ~ .scrub .scrub-track, .slide-media.buffering ~ .scrub .scrub-track {
    background:linear-gradient(90deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.75) 50%,rgba(255,255,255,.18) 100%); background-size:50% 100%; background-repeat:no-repeat;
    animation:scrubwait .9s linear infinite; }
  @keyframes scrubwait { from { background-position:-60% 0; } to { background-position:160% 0; } }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  .slide-media.is-playing img { opacity:0; pointer-events:none; }
  .slide-media iframe { position:absolute; inset:0; width:100%; height:100%; border:0; z-index:1; }
  .slide-media video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#0b0b0b; z-index:1; pointer-events:none; }

  /* scrims hiding TikTok's own chrome; taps can't reach it regardless */
  .mask-bottom {
    position:absolute; left:0; right:0; bottom:0; height:200px; z-index:3;
    background:linear-gradient(to top,rgba(0,0,0,.6) 0%,rgba(0,0,0,.28) 45%,rgba(0,0,0,0) 100%);
    pointer-events:none;
  }
  .mask-rail {
    display:none; position:absolute; right:0; bottom:96px; width:64px; height:250px; z-index:3;
    background:linear-gradient(to left,rgba(0,0,0,.82) 0%,rgba(0,0,0,.5) 55%,rgba(0,0,0,0) 100%);
    pointer-events:none;
  }
  /* full-surface tap interceptor: nothing reaches TikTok's player */

  .status-badge {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5;
    pointer-events:none; text-align:center; max-width:220px;
    font-size:12px; color:rgba(255,255,255,.5);
  }
  .spinner {
    width:26px; height:26px; border-radius:50%; margin:0 auto;
    border:2px solid rgba(255,255,255,.22); border-top-color:rgba(255,255,255,.75);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .slide-media.has-player .status-badge { display:none; }
  /* While a cold video is being resolved/buffered, keep the spinner up over the
     thumbnail so it reads as loading rather than frozen. */
  .slide-media.has-player.resolving .status-badge { display:block; animation:fadein .2s .9s both; }   /* v4: the bottom bar shows waiting first; the spinner only after ~1 s */
  .slide-media.is-playing .status-badge { display:none; }
  .slide-media.paused .pause-icon,
  .slide-media.needs-tap .tap-icon { display:flex; }
  .pause-icon, .tap-icon {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:6;
    width:74px; height:74px; border-radius:50%; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center;
    font-size:30px; color:#fff; pointer-events:none;
  }
  .tap-icon {
    padding-left:6px; width:88px; height:88px; font-size:36px;
    background:rgba(0,0,0,.55); box-shadow:0 0 0 4px rgba(255,255,255,.14);
  }
  .slide-media.needs-tap::after {
    content:'Tap to play'; position:absolute; left:0; right:0; z-index:6;
    top:calc(50% + 62px); text-align:center; font-size:13px;
    color:rgba(255,255,255,.9); text-shadow:0 1px 3px rgba(0,0,0,.7);
    pointer-events:none;
  }
  .slide-media.ffwd::after {
    content:'2\00D7  \25B8\25B8'; position:absolute; top:calc(env(safe-area-inset-top) + 58px); left:50%;
    transform:translateX(-50%); z-index:7; font-size:14px; font-weight:700; letter-spacing:.02em;
    color:#fff; background:rgba(0,0,0,.45); padding:5px 13px; border-radius:16px;
    pointer-events:none;
  }
  .slide-overlay {
    position:absolute; left:0; right:74px; bottom:calc(max(26px,env(safe-area-inset-bottom)) + 14px); transition:opacity .12s;
    padding:0 16px; z-index:6; pointer-events:none;
    text-shadow:0 1px 4px rgba(0,0,0,.65);
  }
  .slide-author { font-size:15px; font-weight:700; margin-bottom:3px; pointer-events:auto; display:inline-block; }
  .slide-desc {
    font-size:13px; line-height:1.35; color:rgba(255,255,255,.95); margin-bottom:5px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .slide-desc.expanded { -webkit-line-clamp:unset; }
  .slide-overlay .slide-desc { pointer-events:auto; }
  .slide-title { font-size:12px; font-weight:600; color:rgba(255,255,255,.8); }
  .slide-cat { font-size:12px; color:rgba(255,255,255,.7); margin-top:1px; }
  .rail {
    position:absolute; right:10px; bottom:max(118px,calc(env(safe-area-inset-bottom) + 108px));
    display:flex; flex-direction:column; align-items:center; gap:16px; z-index:7;
  }
  .rail-btn {
    width:46px; height:46px; border-radius:50%; border:0;
    background:rgba(0,0,0,.5); color:var(--text); font-size:18px;
  }
  .rail-btn.active { background:var(--accent); }
  .rail-btn.blocked { background:#8a5a1f; }

  /* ===================== SHEETS / MODALS ===================== */
  #sheetBackdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:30; }
  #sheetBackdrop.open { display:block; }
  #sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:31; background:#1a1a1a;
    border-radius:16px 16px 0 0; padding:16px 16px max(20px,env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .22s ease; max-height:70vh; overflow-y:auto;
  }
  #sheet.open { transform:translateY(0); }
  .sheet-title { font-size:13px; color:var(--dim); margin-bottom:8px; }
  .sheet-cat { padding:12px 4px; border-bottom:1px solid #262626; font-size:15px; }
  .sheet-cat.selected { color:var(--accent); }
  .sheet-action { font-weight:600; }
  .sheet-action.destructive { color:#ff6b6b; }
  .sheet-new { display:flex; gap:8px; margin-top:14px; }
  .sheet-new input {
    flex:1; background:#101010; border:1px solid #2a2a2a; border-radius:8px;
    color:var(--text); padding:10px 12px; font-size:15px;
  }
  .sheet-new button { background:var(--accent); border:0; border-radius:8px; padding:0 16px; font-weight:600; }

  .modal-backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-card { background:#1c1c1c; border:1px solid var(--line); border-radius:14px; width:100%; max-width:320px; padding:18px; }
  .modal-title { font-size:16px; font-weight:600; margin-bottom:6px; }
  .modal-message { font-size:13px; color:var(--dim); margin-bottom:14px; }
  .modal-input {
    width:100%; background:#101010; border:1px solid #2a2a2a; border-radius:8px;
    color:var(--text); padding:10px 12px; font-size:15px; margin-bottom:6px;
  }
  .modal-error { font-size:12px; color:#ff6b6b; min-height:15px; }
  .modal-actions { display:flex; gap:8px; margin-top:10px; }
  .modal-btn { flex:1; border:0; border-radius:8px; padding:11px 0; font-size:14px; font-weight:600; background:#2a2a2a; }
  .modal-btn.primary { background:var(--accent); }
  .modal-btn.destructive { background:#4a2020; color:#ff8f8f; }

  .action-sheet {
    position:fixed; left:16px; right:16px; bottom:max(20px,env(safe-area-inset-bottom));
    z-index:41; background:#1c1c1c; border-radius:14px; overflow:hidden;
  }
  .action-sheet-title { font-size:12px; color:var(--dim); text-align:center; padding:12px; border-bottom:1px solid #262626; }
  .action-row { padding:14px; text-align:center; font-size:16px; border-bottom:1px solid #262626; }
  .action-row.destructive { color:#ff6b6b; }
  .action-row.cancel { font-weight:600; border-bottom:0; }

  #toast {
    position:fixed; top:max(16px,env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); background:#222; padding:8px 16px; border-radius:20px;
    font-size:13px; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.4); display:none;
  }
  #toast.show { display:block; }

  #debugLog {
    position:absolute; left:0; right:0; bottom:0; max-height:38vh; overflow-y:auto;
    margin:0; padding:8px 10px; background:rgba(0,0,0,.82); color:#5f5;
    font-family:ui-monospace,monospace; font-size:10px; line-height:1.35;
    z-index:40; white-space:pre-wrap; pointer-events:none; display:none;
  }
  #debugLog.show { display:block; }
</style>
</head>
<body>

<div id="home">
  <div id="shuffleTile"><div class="name">Shuffle</div><div class="count" id="shuffleCount"></div></div>
  <div id="allTile"><div class="name">All Videos</div><div class="count" id="allCount">Loading…</div></div>
  <button id="addLinkBtn">＋ Add a shared link</button>
  <div id="catGrid"></div>
  <div id="verBadge"></div>
  <button id="libBtn">Library &amp; backup</button>
  <input type="file" id="filePick">
</div>

<div id="gridView">
  <div class="grid-top">
    <button class="icon-btn" id="gridBack">&lsaquo;</button>
    <div class="grid-title" id="gridTitle">All Videos</div>
    <button class="icon-btn" id="gridManage" aria-label="Manage category" style="display:none">&#8942;</button>
    <button class="icon-btn" id="searchBtn" aria-label="Search">&#128269;</button>
    <button class="icon-btn" id="dateJumpBtn" style="display:none">&#128197;</button>
  </div>

let saveTimer = null;

// and when the app is hidden; never written from an empty or half-built state.

    if (x && typeof x === 'object') { X = x; normX(); try { localStorage.setItem('gallery-x', sx.json); } catch (e) {} } } } catch (e) {}

  if (!fresh) { handleIncomingAdd(); renderHome(); resumeAfterUpdate(); return; }

  try {
    const raw = await (await fetch('favorites.json')).json();

// v4: an automatic update reloads the page; put the grid back where it was.
function resumeAfterUpdate() {

  if (!r || !r.label) return;

/* ---- v12: Shuffle feed (SPEC -> Shuffle feed) ----

   else in localStorage 'gallery-shuffle' (mirrored, in backups):
     s: { id: time last WATCHED IN THE SHUFFLE FEED }   a: { id: time last watched anywhere else }

   the last shuffle view (never seen = 365, capped there). Unseen only: random among never-seen;

let SH = (() => { try { return JSON.parse(localStorage.getItem('gallery-shuffle') || 'null'); } catch (e) { return null; } })() || {};

  SH.s = SH.s || {}; SH.a = SH.a || {}; SH.mode = SH.mode === 'unseen' ? 'unseen' : 'fresh';

normSH();
let _shTimer = null, _shMirrorAt = 0, feedMode = 'list';
function saveSH(now) {
  const w = () => { _shTimer = null; const j = JSON.stringify(SH); try { localStorage.setItem('gallery-shuffle', j); } catch (e) {}
    if (now || Date.now() - _shMirrorAt > 60000) { _shMirrorAt = Date.now(); LIB.putSnapAs('gallery-shuffle', j); } };

window.addEventListener('pagehide', () => { if (_shTimer) saveSH(true); });
function shuffleEligible() { return state.items.filter(i => i.category !== DELETED && !isGone(i.id)); }

    const unseen = pool.filter(i => !SH.s[i.id]);

    if (out.length < n) { const got = new Set(out.map(i => i.id)); out.push(...pool.filter(i => SH.s[i.id] && !got.has(i.id)).sort((a, b) => SH.s[a.id] - SH.s[b.id]).slice(0, n - out.length)); }
    return out;
  }

  let more = shuffleDraw(sess, SH.mode, need);

    sess.served = sess.served.slice(-50).filter(id => list.some(i => i.id === id)); more = shuffleDraw(sess, SH.mode, need); sess.served = list.map(i => i.id);

}

  const el = slotEls['0']; if (!el || !el._vid || el._vid.paused || document.hidden || el._seenMarked) return;
  el._played = (el._played || 0) + 0.5;
  if (el._played >= 2) { el._seenMarked = true; (feedMode === 'shuffle' ? SH.s : SH.a)[el.dataset.id] = Date.now(); saveSH(); }
}, 500);

const SHARED_CAT = 'Shared with me';
/* ---- v9: extra organizing data, kept APART from gallery-state ----
   localStorage 'gallery-x' = { from: { videoId: person }, parents: { child: parent } }. Older
   releases never read or write this key, so rolling back cannot damage it, and gallery-state
   keeps its format. Mirrored to IndexedDB like the main state, and included in backup files. */
let X = (() => { try { return JSON.parse(localStorage.getItem('gallery-x') || 'null'); } catch (e) { return null; } })() || {};
function normX() { if (!X || typeof X !== 'object') X = {}; X.from = X.from || {}; X.parents = X.parents || {}; X.saved = X.saved || {}; }
normX();
function saveX() { const j = JSON.stringify(X); try { localStorage.setItem('gallery-x', j); } catch (e) {} LIB.putSnapAs('gallery-x', j); }
// v11: subcategories. Categories stay a flat list of unique names in gallery-state (older
// releases simply see them all as ordinary categories); who sits under whom is X.parents.
function cleanParents() {
  let ch = false;
  for (const c in X.parents) { const p = X.parents[c];
    if (!state.categories.includes(c) || !state.categories.includes(p) || c === p || c === DELETED || p === DELETED || treeOf(c).includes(p)) { delete X.parents[c]; ch = true; } }
  if (ch) saveX();
}
function childrenOf(cat) { return state.categories.filter(c => X.parents[c] === cat && c !== cat); }
function treeOf(cat) { const out = [cat]; for (let i = 0; i < out.length && i < 400; i++) childrenOf(out[i]).forEach(c => { if (!out.includes(c)) out.push(c); }); return out; }

  const out = [], seen = new Set();
  const walk = (c, d) => { if (seen.has(c)) return; seen.add(c); out.push({ name: c, depth: d }); if (d < 8) childrenOf(c).forEach(k => walk(k, d + 1)); };
  state.categories.filter(c => c !== DELETED && !X.parents[c]).forEach(c => walk(c, 0));

}
function refreshViews() {
  renderHome();
  if (document.getElementById('gridView').classList.contains('open') && !document.getElementById('feed').classList.contains('open') && state.categories.includes(gridLabel)) openGrid(itemsOfTree(gridLabel), gridLabel, true);
}
function senderOf(id) { return X.from[id] || ''; }
function catLine(item) { const p = senderOf(item.id); return item.category + (p ? '  ·  from ' + p : '') + (X.saved[item.id] ? '  ·  saved' : ''); }
function people() {              // [{name, n}] among videos not deleted, most videos first
  const c = {}; liveItems().forEach(i => { const p = X.from[i.id]; if (p) c[p] = (c[p] || 0) + 1; });
  return Object.keys(c).map(name => ({ name, n: c[name] })).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
}
function setSender(id, name) {

// "Who sent it?": the people already used, New person, Skip. Shown right after a shared link is
// added (with the video's thumbnail as confirmation) and from the organize sheet to change it.
function senderModal(id, justAdded) {
  closeOverlays();

    '<div class="modal-title">' + (justAdded ? 'Added to “Shared with me”' : 'Who sent it?') + '</div>' +
    '<div class="modal-message" style="margin:0">' + (justAdded ? 'Who sent it?' : (cur ? 'Now: ' + esc(cur) : 'Not set')) + '</div></div></div>' +
    '<div class="chips">' + ppl.map((p, i) => '<button class="chip' + (p.name === cur ? ' on' : '') + '" data-i="' + i + '">' + esc(p.name) + '</button>').join('') + '</div>' +
    '<div class="modal-actions"><button class="modal-btn" id="sndSkip">' + (cur && !justAdded ? 'No one' : 'Skip') + '</button><button class="modal-btn primary" id="sndNew">New person</button></div></div>';

}
// Add a video (by id) into the "Shared with me" category. Returns true if it
// resulted in a change worth re-rendering.
function addSharedVideo(id) {
  if (!id) return false;
  id = String(id);
  const existing = state.items.find(i => i.id === id);
  if (existing) {
    if (existing.category === DELETED || existing.category === 'Uncategorized') existing.category = SHARED_CAT;
    else { toast('Already in your library'); return true; }
  } else {
    if ((state.purged || []).includes(id)) state.purged = state.purged.filter(x => x !== id);   // adding it again by hand is a deliberate undo
    state.items.unshift({ id, date: new Date().toISOString().replace('T',' ').slice(0,19), category: SHARED_CAT });
  }
  if (!state.categories.includes(SHARED_CAT)) state.categories.unshift(SHARED_CAT);
  flushSave();
  toast('Added to “Shared with me”');
  setTimeout(() => senderModal(id, true), 60);      // after the paste dialog has closed itself

// Accepts any TikTok link the user pastes/shares. If the numeric id is in the

function addSharedLink(raw, onDone) {

  const direct = raw.match(/\/video\/(\d+)/) || raw.match(/^(\d{6,25})$/);
  if (direct) { const ch = addSharedVideo(direct[1]); startHarvest(); onDone && onDone(ch); return; }

    .then(r => r.json())
    .then(j => {

      if (vid) {

        const ch = addSharedVideo(String(vid)); startHarvest(); onDone && onDone(ch);

    })
    .catch(() => { toast('Could not read that link'); onDone && onDone(false); });

/* ============================================================

   A failed fetch must NEVER permanently brand a video unavailable:

   Only an explicit "this video is gone" response is treated as final,

   ============================================================ */
const THUMB_TTL   = 6 * 60 * 60 * 1000;   // fallback lifetime for a cover URL whose own expiry can't be read
const GONE_TTL    = 7 * 24 * 60 * 60 * 1000;  // v2: re-check "gone" verdicts after a week (a tap re-checks at once)
const MAX_INFLIGHT = 3;                   // thumbnails come from the ~1/s resolver, so keep only a few queued there
// v2: cover links carry their own expiry (x-expires, about 24 h, measured Nov 14 2026).
function coverExpiry(u) {
  const m = /[?&]x-expires=(\d{9,11})/.exec(u || ''); const x = m ? Number(m[1]) * 1000 : 0;
  return (x > Date.now() && x < Date.now() + 72 * 3600e3) ? x : 0;
}

/* ---- persistent caches (victor): IndexedDB instead of localStorage ----
   localStorage is capped at ~5 MB per site and the caption index alone outgrows
   it, so the caches now live in IndexedDB (hundreds of MB on iOS) and each entry
   saves on its own, instead of re-serialising megabytes every 3 s. The user's

const KV = (() => {
  let dbp = null, ok = typeof indexedDB !== 'undefined';

    if (!dbp) dbp = new Promise((res, rej) => {
      let r; try { r = indexedDB.open('favorites-kv', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => { const d = r.result; ['thumb', 'meta', 'rv'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);

    const d = await db();
    return new Promise((res, rej) => {

      const req = tx.objectStore(store).openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
    });

    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction(store, 'readwrite'); const os = tx.objectStore(store);
      puts.forEach(([k, v]) => os.put(v, k)); dels.forEach(k => os.delete(k));

// A plain object whose writes/deletes are remembered, so only changed entries are saved.
function trackedStore(initial) {

const _thumbTS = trackedStore(legacyLoad('thumb-cache'));

let cacheDirty = false;
setInterval(() => {
  cacheDirty = false;

const pending = new Map();      // id -> {id, priority(), cbs:[]}
const inflight = new Map();     // id -> AbortController
let activeFetches = 0;
let failStreak = 0;
let backoffUntil = 0;

function cachedThumb(id) {
  const e = thumbCache[id];
  if (!e) return null;
  if (e.gone) return (Date.now() - e.t < GONE_TTL) ? { gone: true } : null;
  if (Date.now() > (e.x ? e.x - 300000 : e.t + THUMB_TTL)) return null;      // stale URL, refetch

let _libLoaded = false; LIB.ready.then(() => { _libLoaded = true; });
function requestThumb(id, cb, priority) {

  if (LIB.has(id)) {                       // v2: the image is already on the phone, no network
    LIB.coverUrl(id).then(u => {
      if (!u) { requestThumbRemote(id, cb, priority); return; }
      cb({ url: u });
      if (isGone(id)) cb({ gone: true });
    });
    return;
  }
  requestThumbRemote(id, cb, priority);
}
function requestThumbRemote(id, cb, priority) {
  const hit = cachedThumb(id);
  if (hit && hit.gone) { cb(hit); return; }
  // a still-valid link from an earlier visit: fetch it once, keep the bytes, show the stored copy
  if (hit) { LIB.saveCover(id, hit.url).then(u => cb({ url: u || hit.url })); return; }
  const ex = pending.get(id);
  if (ex) { ex.cbs.push(cb); ex.warm = false; return; }
  pending.set(id, { id, cbs: [cb], priority: priority || (() => 0) });

// v2: covers no longer need the resolver once stored, so nothing else would get the
// videos on screen ready to play. While a grid is showing, quietly resolve the ones
// whose cover is local but whose video link is missing or expired (closest first,
// dropped when the tile scrolls away, paused while the feed is open).
function warmPlay(id, priority) {
  LIB.ready.then(() => {
    if (!LIB.has(id) || cacheGet(id) || pending.has(id) || isGone(id)) return;
    pending.set(id, { id, cbs: [], priority: priority || (() => 0), warm: true });
    schedulePump();

function dropThumbRequest(id) {
  const p = pending.get(id);
  if (p) pending.delete(id);
  const c = inflight.get(id);
  if (c) { c.abort(); inflight.delete(id); }

let pumpScheduled = false;
function schedulePump() {
  if (pumpScheduled) return;
  pumpScheduled = true;
  // Deferred so an entire batch of newly visible tiles is queued before any
  // fetch starts — otherwise arrival order wins and priority never applies.
  setTimeout(() => { pumpScheduled = false; pump(); }, 0);
}

function pump() {
  // xray: never spend the resolver budget on thumbnails while a video is on screen
  if (document.getElementById('feed').classList.contains('open')) { setTimeout(schedulePump, 1000); return; }
  if (Date.now() < backoffUntil) {
    setTimeout(schedulePump, backoffUntil - Date.now() + 20);
    return;
  }
  while (activeFetches < MAX_INFLIGHT && pending.size) {
    let best = null, bestP = Infinity;
    pending.forEach(p => { const v = p.priority(); if (v < bestP) { bestP = v; best = p; } });
    if (!best) break;
    pending.delete(best.id);
    startFetch(best);
  }

function startFetch(req) {
  // xray (Nov 15 2026): TikTok's oEmbed stopped returning thumbnail_url / author / title
  // (it now answers with only the id), so thumbnails and captions come from the
  // resolver's cover + metadata instead, at low priority behind the feed. Bonus: the
  // video URL gets cached too, so a tapped thumbnail plays at once.
  if (req.warm && cacheGet(req.id)) { schedulePump(); return; }   // already playable
  activeFetches++;
  inflight.set(req.id, { abort() { cancelThumbResolve(req.id); } });
  resolveForThumb(req.id)
    .then(r => {
      if (r === 'dropped') return { retry: true };            // pruned for the feed; try again later
      if (r && r.gone) return { gone: true };                 // remembered by markGone()
      if (r && r.cover) {
        thumbCache[req.id] = { u: r.cover, t: Date.now(), x: coverExpiry(r.cover) };
        cacheDirty = true; failStreak = 0;
        // v2: keep the bytes; show the stored copy (falls back to the link if storing failed)

      }
      return null;                                            // resolver couldn't: leave the date tile
    })
    .then(result => {
      if (result) req.cbs.forEach(cb => { try { cb(result); } catch (e) {} });
    })
    .finally(() => {
      inflight.delete(req.id);
      activeFetches--;
      schedulePump();
    });
}

// Binds a thumbnail to an <img>, surviving the two ways TikTok fails us:
//  - a transient failure (throttling, flaky network) -> retry with backoff,
//    because a tile that stays on screen would otherwise never load again;
//  - an expired cached URL -> the image fails to decode, so refetch it once.
function bindThumb(imgEl, id, priority, onGone) {
  let urlRetried = false, attempts = 0;
  const alive = () => imgEl.parentNode !== null;

  const apply = (r) => {
    if (!alive()) return;
    if (r.gone) { if (onGone) onGone(); return; }
    if (r.retry) {
      // Try again while this tile is still on screen, backing off each time.
      if (++attempts > 6) return;
      setTimeout(() => { if (alive()) requestThumb(id, apply, priority); },
                 Math.min(20000, 700 * Math.pow(2, attempts)));
      return;
    }
    if (imgEl.dataset.hi) return;               // v4: a full-frame poster is already showing
    imgEl.onerror = () => {
      if (urlRetried) return;
      urlRetried = true;
      delete thumbCache[id]; cacheDirty = true;   // the signed URL expired
      requestThumb(id, apply, priority);
    };
    imgEl.onload = () => imgEl.classList.add('loaded');
    imgEl.src = r.url;
  };
  requestThumb(id, apply, priority);
}

/* ============================================================
   VIRTUAL LIST
   Only the visible window exists in the DOM, so cost is constant
   whether the library holds 30 videos or 6,070.
   ============================================================ */
function VirtualList(opts) {
  const { scroller, content, perRow, overscan } = opts;
  const self = {
    items: [], rowH: 0, perRow: perRow || 1, overscan: overscan == null ? 2 : overscan,
    live: new Map(), range: [-1,-1], onRange: null
  };
  self.rows = () => Math.ceil(self.items.length / self.perRow);
  self.totalHeight = () => self.rows() * self.rowH;

  self.setItems = (items, rowH) => {
    self.items = items;
    if (rowH) self.rowH = rowH;
    self.live.forEach(el => el.remove());
    self.live.clear();
    self.range = [-1,-1];
    content.style.height = self.totalHeight() + 'px';
    self.update(true);
  };

  self.indexAtScroll = () => Math.round(scroller.scrollTop / Math.max(1, self.rowH)) * self.perRow;

  self.update = (force) => {
    if (!self.rowH) return;
    const first = Math.max(0, Math.floor(scroller.scrollTop / self.rowH) - self.overscan);
    const last  = Math.min(self.rows() - 1,
                  Math.ceil((scroller.scrollTop + scroller.clientHeight) / self.rowH) + self.overscan);
    if (!force && first === self.range[0] && last === self.range[1]) return;
    self.range = [first, last];

    const need = new Set();
    for (let r = first; r <= last; r++) {
      for (let c = 0; c < self.perRow; c++) {
        const i = r * self.perRow + c;
        if (i < self.items.length) need.add(i);
      }
    }
    self.live.forEach((el, i) => {
      if (!need.has(i)) { opts.recycle && opts.recycle(el, i); el.remove(); self.live.delete(i); }
    });
    need.forEach(i => {
      if (self.live.has(i)) return;
      const el = opts.render(self.items[i], i);
      const r = Math.floor(i / self.perRow), c = i % self.perRow;
      el.style.top = (r * self.rowH) + 'px';
      if (self.perRow > 1) {
        el.style.left = (c * (100 / self.perRow)) + '%';
        el.style.width = (100 / self.perRow) + '%';
      }
      el.style.height = (opts.itemHeight || self.rowH) + 'px';
      content.appendChild(el);
      self.live.set(i, el);
    });
    if (self.onRange) self.onRange();
  };

  self.scrollToIndex = (i) => {
    scroller.scrollTop = Math.floor(i / self.perRow) * self.rowH;
    self.update(true);
  };
  self.get = (i) => self.live.get(i);
  return self;
}

  kids.forEach(k => { const c = document.createElement('button'); c.className = 'chip'; c.textContent = '\u25B8 ' + k + '  ' + itemsOfTree(k).length;
    c.onclick = () => { gridStack.push({ list: gridBaseList, label: gridLabel, scroll: gridScroll.scrollTop }); openGrid(itemsOfTree(k), k); gridScroll.scrollTop = 0; gridVL.update(true); };
    row.appendChild(c); });
  if (!ppl.length) { row.classList.add('open'); return; }
  if (chipSel.indexOf('p:') === 0 && !ppl.some(p => 'p:' + p.name === chipSel)) chipSel = '';
  const mk = (text, key) => { const c = document.createElement('button'); c.className = 'chip' + (key === chipSel ? ' on' : ''); c.textContent = text;
    c.onclick = () => { chipSel = key; [...row.children].forEach(x => x.classList.toggle('on', x === c)); gridBaseList = chipList(); runSearch(document.getElementById('searchInput').value); };
    row.appendChild(c); };
  mk('All', ''); ppl.forEach(p => mk(p.name + '  ' + p.n, 'p:' + p.name));

}
function openGrid(list, label, keepChips) {

// ---- Search over creator / description / category / date ----
// Searches the metadata store (populated as videos are browsed/played) plus the
// always-known fields (category, date). Filters the current grid's base list and
// re-renders through the same virtualized grid, so tapping a result opens the
// feed exactly as normal.
function matchSearch(item, q) {

  const lbl = itemLabel(item); if (lbl && lbl.toLowerCase().includes(q)) return true;
  const fr = X.from[item.id]; if (fr && fr.toLowerCase().includes(q)) return true;
  const m = metaStore[item.id]; if (!m) return false;
  return (m.author && m.author.toLowerCase().includes(q)) ||
         (m.handle && m.handle.toLowerCase().includes(q)) ||
         (m.desc   && m.desc.toLowerCase().includes(q));
}
function runSearch(qRaw) {
  const q = (qRaw || '').trim().toLowerCase();
  const list = q ? gridBaseList.filter(it => matchSearch(it, q)) : gridBaseList;
  gridList = list;
  const empty = document.getElementById('gridEmpty');
  empty.textContent = q && !list.length ? 'No matches (metadata fills in as you browse).' : 'Nothing here yet.';
  empty.style.display = list.length ? 'none' : 'block';

}
document.getElementById('gridManage').onclick = () => manageCategory(gridLabel);
document.getElementById('searchBtn').onclick = () => {

/* ---- date jump ---- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const btn = document.getElementById('dateJumpBtn');

  });

  document.getElementById('datePanel').classList.toggle('open');

/* ============================================================
   FEED — transform carousel (NO native scroll).
   The stage is a fixed viewport. A track holds exactly three slides
   (previous / current / next), positioned by an absolute transform. Swiping
   drags the track with the finger; on release it either advances one video or
   snaps back, animated with a CSS transition. There is no scroll container, no
   scroll-snap, no momentum, no spacers, no scrollTop — so the whole class of
   "racing / stuck between videos" bugs cannot occur. Only 3 videos are ever in
   the DOM regardless of library size.
   ============================================================ */
const stage = document.getElementById('stage');
const track = document.getElementById('track');
let feedList = [], feedLabel = '';
let curIndex = -1;               // index of the currently-shown video
let desiredMuted = true;
let audioUnlocked = false;   // set true on the first unmute tap (a real gesture); persists sound across swipes

// slot elements: slots[-1]=prev, slots[0]=current, slots[1]=next (by offset)
let slotEls = { '-1': null, '0': null, '1': null };
let stageH = 0;

let animating = false;

function stageHeight() { return stage.clientHeight || window.innerHeight || 700; }

function setTrack(y, animate, ms) {
  track.style.transition = animate ? 'transform ' + (ms || 260) + 'ms cubic-bezier(.2,.8,.25,1)' : 'none';
  track.style.transform = 'translate3d(0,' + y + 'px,0)';
}

// Base offset that centres the current slide: slots are laid at rows -1,0,1
// (pixel tops -H, 0, H), and the track is translated 0, so the row-0 slide fills
// the stage. We translate by -dragDY during a drag (drag up = negative dy shows next).
function layoutSlots() {
  stageH = stageHeight();
  ['-1','0','1'].forEach(k => {
    const el = slotEls[k];
    if (!el) return;
    el.style.height = stageH + 'px';
    el.style.top = (Number(k) * stageH) + 'px';
  });
}

function openFeed(list, label, startIndex) {
  feedMode = 'list'; paintShuffleBar();
  feedList = list.slice(); feedLabel = label;
  document.getElementById('feedLabel').textContent = label;
  document.getElementById('feed').classList.add('open');
  curIndex = Math.max(0, Math.min(startIndex || 0, list.length - 1));
  buildAllSlots();
  layoutSlots();
  setTrack(0, false);
  // Opening the feed is a deliberate tap on a specific video, so load it
  // promptly — only a short settle, unlike the longer dwell used for swipes.
  scheduleCurrentPlayer(0);   // v4: no built-in wait before the tapped video starts loading
}

function closeFeed() {
  if (dwellTimer) { clearTimeout(dwellTimer); dwellTimer = null; }
  clearResolveQueue();   // stop resolver work so it doesn't compete with the library's thumbnail loading
  ['-1','0','1'].forEach(k => { if (slotEls[k]) destroyPlayer(slotEls[k]); });
  track.innerHTML = '';
  slotEls = { '-1': null, '0': null, '1': null };
  document.getElementById('feed').classList.remove('open');
  curIndex = -1;
  if (feedMode === 'shuffle') saveSH(true);
  feedMode = 'list'; paintShuffleBar();
}
document.getElementById('feedBack').onclick = () => { const wasShuffle = feedMode === 'shuffle'; closeFeed(); if (wasShuffle) renderHome(); else openGrid(gridList, gridLabel, true); };
// v4: tap a creator's name on a video to see everything saved from them
function openCreator(id) {
  const m = metaStore[id];
  if (!m || !(m.handle || m.author)) { toast('Creator not known yet for this video'); return; }
  const key = (m.handle || '').toLowerCase(), name = m.author || '';
  const list = liveItems().filter(i => { const x = metaStore[i.id]; return !!x && (key ? (x.handle || '').toLowerCase() === key : x.author === name); });
  const back = { list: gridBaseList, label: gridLabel, scroll: gridScrollMemory[gridLabel] || 0 };
  closeFeed();
  gridStack.push(back);
  openGrid(list, m.handle ? '@' + m.handle : name);
  gridScroll.scrollTop = 0; gridVL.update(true);
}

function indexForOffset(off) { return curIndex + off; }

function buildAllSlots() {
  // Destroy existing players/timers FIRST — wiping track.innerHTML detaches the
  // elements but does NOT stop their _playTimer/_readyWatchdog intervals (plain
  // JS timers, no DOM lifecycle tie), which would keep firing on orphaned
  // elements. Hit whenever this runs with a live player present (e.g.
  // feedDropCurrent — deleting the currently-open video).
  ['-1','0','1'].forEach(k => { if (slotEls[k]) destroyPlayer(slotEls[k]); });
  track.innerHTML = '';
  slotEls = { '-1': null, '0': null, '1': null };
  ['-1','0','1'].forEach(k => {
    const idx = curIndex + Number(k);
    if (idx < 0 || idx >= feedList.length) return;
    const el = buildSlide(feedList[idx], idx);
    el.dataset.slot = k;
    track.appendChild(el);
    slotEls[k] = el;
  });
  layoutSlots();
}

// Advance the carousel by +1 (next) or -1 (prev), recycling slots so only three
// Advance by ±1. Recycle the existing slot elements instead of rebuilding them,
// so the video you swiped to — which was already preloaded — keeps its player
// and starts instantly, rather than being destroyed and recreated (a recreate
// loses any warm autoplay state and causes a visible reload).
function commitAdvance(dir) {
  const newIndex = curIndex + dir;
  if (newIndex < 0 || newIndex >= feedList.length) { setTrack(0, true); return; }
  if (slotEls['0']) pauseSlide(slotEls['0']);

  const old = { '-1': slotEls['-1'], '0': slotEls['0'], '1': slotEls['1'] };
  const next = { '-1': null, '0': null, '1': null };

  if (dir === 1) {
    // moving forward: old next becomes current, old current becomes prev.
    // Only the FAR edge leaves the window — release its pooled video. The other
    // two keep their (preloaded) videos, so the incoming current is already
    // buffered and plays instantly.
    if (old['-1']) { unmountSlot(old['-1']); dropThumbRequest(old['-1'].dataset.id); old['-1'].remove(); }
    next['-1'] = old['0'];
    next['0']  = old['1'];
    curIndex = newIndex;
    next['1'] = makeSlotSlide(curIndex + 1);
  } else {
    if (old['1']) { unmountSlot(old['1']); dropThumbRequest(old['1'].dataset.id); old['1'].remove(); }
    next['1']  = old['0'];
    next['0']  = old['-1'];
    curIndex = newIndex;
    next['-1'] = makeSlotSlide(curIndex - 1);
  }

  slotEls = next;
  // v4: a video you swipe back to starts from the beginning, as on TikTok
  const left = slotEls[dir === 1 ? '-1' : '1'];
  if (left && left._vid) { try { left._vid.pause(); left._vid.currentTime = 0; } catch (e) {} }
  ['-1','0','1'].forEach(k => { if (slotEls[k]) slotEls[k].dataset.slot = k; });
  layoutSlots();
  setTrack(0, false);
  // Promote the already-preloaded new current immediately (instant play), then
  // mount/preload the newly-exposed edge after a short settle so fast flicks
  // don't fire a burst of resolves.
  promoteCurrent();
  scheduleCurrentPlayer(DWELL_MS);
  if (feedMode === 'shuffle') shuffleMoved();
}

function promoteCurrent() {
  const el = slotEls['0']; if (!el) return;
  const it = feedList[curIndex];
  if (it) { const c = el.querySelector('.slide-cat'); if (c) c.textContent = catLine(it); }
  fillOverlay(el, el.dataset.id);   // refresh creator/description from cache on activate
  el._becameCurrentAt = Date.now(); el._diag = []; el._wantPlay = true; el._resumes = 0;
  if (el._vid && el._vidId === el.dataset.id) {
    // preloaded neighbour promoted — just play it (usually already started when the finger lifted)
    delete el.dataset.userPaused;
    const v = el._vid;
    v.muted = desiredMuted || !audioUnlocked;
    const p = v.play(); if (p) p.catch(()=>{});
    // if sound was refused, play muted rather than sit frozen
    if (!v.muted) setTimeout(() => { if (slotEls['0'] === el && el._vid === v && el.dataset.userPaused !== 'true' && v.paused) { v.muted = true; const q = v.play(); if (q) q.catch(()=>{}); } }, 900);
  } else {
    mountSlot(el, true);
  }
  ensurePlaying(el);
}

// One debounce timer, shared across the whole feed, cleared on every swipe.
let dwellTimer = null;
const DWELL_MS = 250;     // settle before mounting/preloading the new edge slide
function scheduleCurrentPlayer(delay) {
  if (dwellTimer) { clearTimeout(dwellTimer); dwellTimer = null; }
  const target = slotEls['0'];
  if (!target) return;
  dwellTimer = setTimeout(() => {
    dwellTimer = null;
    if (slotEls['0'] !== target) return;
    if (!document.getElementById('feed').classList.contains('open')) return;
    playCurrent();
  }, delay);
}

// Build a slide for an absolute index and insert it into the track (or return
// null if out of range). Used to fill the newly-exposed edge slot on advance.
function makeSlotSlide(idx) {
  if (idx < 0 || idx >= feedList.length) return null;
  const el = buildSlide(feedList[idx], idx);
  track.appendChild(el);
  return el;
}

// Run fn after the next paint. Setting an iframe's src in the same frame the
// slide's position/visibility just changed makes the browser silently drop the
// load, so player creation must wait one paint. A SINGLE rAF is the minimum
// paint-aligned path iOS needs for the muted-autoplay grant; a setTimeout
// backstop guarantees fn still runs in a later task if rAF is ever starved
// (tab backgrounded, Low Power Mode) — which would otherwise leave the video
// permanently unloaded. Kept to one frame (not two) because every extra tick
// between the swipe gesture and the src assignment is time iOS's separate,
// stricter "audible autoplay needs a recent user gesture" check can run out
// on — unlike the muted-autoplay grant, that one appears to require the
// navigation to still read as gesture-adjacent, not just post-paint.
function deferToPaint(fn) {
  let done = false;
  const run = () => { if (done) return; done = true; fn(); };
  requestAnimationFrame(run);
  setTimeout(run, 80);
}

function playCurrent() {
  const el = slotEls['0'];
  if (!el) return;
  // Update the caption immediately (cheap, and it should never wait for a paint).
  const it = feedList[curIndex];
  if (it) { const c = el.querySelector('.slide-cat'); if (c) c.textContent = catLine(it); }

  // After a paint, mount current (playing) + both neighbours (preloaded, paused)
  // so the next swipe in either direction promotes an already-buffered element.
  deferToPaint(() => {
    if (slotEls['0'] !== el) return;
    if (!document.getElementById('feed').classList.contains('open')) return;
    if (!el._becameCurrentAt) el._becameCurrentAt = Date.now();
    syncSlots();
    ensurePlaying(el);
  });
}

/* ---------- gestures on the stage ---------- */
// v4 swipe handling. Three changes from before: (1) the incoming video starts the moment
// the finger lifts, not after the slide animation; (2) a touch during the animation
// finishes it at once and starts the next drag, so a quick second swipe is never dropped;
// (3) flicks are judged by finger speed, and a faster flick gets a shorter animation.
let dragVel = 0, lastMoveY = 0, lastMoveT = 0, _animDone = null;
stage.addEventListener('pointerdown', (e) => {
  if (animating && _animDone) _animDone();
  if (animating) return;
  dragging = true; dragMoved = false;
  dragStartY = e.clientY; dragDY = 0; dragStartT = Date.now();
  dragVel = 0; lastMoveY = e.clientY; lastMoveT = performance.now();
  setTrack(0, false);
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { if (!dragMoved && dragging) startFF(); }, 350);
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});

stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  if (holding) return;                       // while holding for 2x the finger may wander
  dragDY = e.clientY - dragStartY;
  const now = performance.now(), dtm = now - lastMoveT;
  if (dtm > 0) { dragVel = dragVel * 0.5 + ((e.clientY - lastMoveY) / dtm) * 0.5; lastMoveY = e.clientY; lastMoveT = now; }
  if (Math.abs(dragDY) > 8) { dragMoved = true; clearTimeout(holdTimer); }
  let dy = dragDY;
  // resist at the ends (no prev before 0, no next after last)
  if (curIndex === 0 && dy > 0) dy *= 0.3;
  if (curIndex === feedList.length - 1 && dy < 0) dy *= 0.3;
  setTrack(dy, false);
});

// Start the video being swiped to (and stop the one leaving) as soon as the swipe is decided.
function startIncoming(dir) {
  const inc = slotEls[String(dir)], out = slotEls['0'];
  if (out) { out._wantPlay = false; pauseSlide(out); }
  if (!inc) return;
  inc._wantPlay = true; delete inc.dataset.userPaused;
  if (inc._vid && inc._vidId === inc.dataset.id) {
    inc._vid.muted = desiredMuted || !audioUnlocked;
    const p = inc._vid.play(); if (p) p.catch(()=>{});
  }
}
function slideTo(dir) {

  const remaining = Math.max(0, H - Math.abs(dragDY));
  const ms = Math.round(Math.max(130, Math.min(260, remaining / Math.max(Math.abs(dragVel), 2.4))));
  animating = true;
  startIncoming(dir);
  setTrack(dir > 0 ? -H : H, true, ms);
  afterTransition(() => { animating = false; commitAdvance(dir); }, ms);
}
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  clearTimeout(holdTimer);
  if (holding) { stopFF(); setTrack(0, false); return; }
  const dt = Date.now() - dragStartT;
  const H = stageHeight();
  // a tap: little movement, short time → toggle play/pause
  if (!dragMoved && dt < 400) { toggleCurrent(); setTrack(0, false); return; }
  if (performance.now() - lastMoveT > 90) dragVel = 0;          // the finger stopped before lifting
  const far = Math.abs(dragDY) > H * 0.18;
  const flick = Math.abs(dragVel) > 0.35 && Math.abs(dragDY) > 24 && (dragVel < 0) === (dragDY < 0);
  if (dragDY < 0 && (far || flick) && curIndex < feedList.length - 1) slideTo(1);
  else if (dragDY > 0 && (far || flick) && curIndex > 0) slideTo(-1);
  else setTrack(0, true, 180);   // snap back
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', () => { dragging = false; clearTimeout(holdTimer); if (holding) stopFF(); setTrack(0, true, 180); });

function afterTransition(fn, ms) {
  let done = false;
  const h = () => { if (done) return; done = true; _animDone = null; track.removeEventListener('transitionend', h); fn(); };
  _animDone = h;
  track.addEventListener('transitionend', h);
  setTimeout(h, (ms || 260) + 100);   // fallback in case transitionend doesn't fire
}

/* ---------- tap play/pause + hold fast-forward ---------- */
function toggleCurrent() {
  const el = slotEls['0']; if (!el) return;
  const media = el.querySelector('.slide-media');
  if (el.classList.contains('unavailable-slide')) {
    // v2: a tap re-checks a video that was remembered as unavailable
    el.classList.remove('unavailable-slide'); delete thumbCache[el.dataset.id]; cacheDirty = true;
    const sb = media.querySelector('.status-badge'); if (sb) sb.innerHTML = '<div class="spinner"></div>';
  }
  const v = el._vid;
  if (media.classList.contains('needs-tap') || !v) {
    // Manual recovery: re-resolve and try again. Clear any cached-but-dead URL.
    media.classList.remove('needs-tap');
    cacheDrop(el.dataset.id);
    el._vidId = null;
    mountSlot(el, true); ensurePlaying(el);
    return;
  }
  if (!v.paused) {
    el.dataset.userPaused = 'true'; v.pause(); el._state = 2; media.classList.add('paused');
  } else {
    delete el.dataset.userPaused;
    v.muted = desiredMuted || !audioUnlocked;
    const p = v.play(); if (p) p.catch(()=>{});
    media.classList.remove('paused');
  }
}

// v4: hold = real 2x playback (native playbackRate, sound included), the way TikTok does it.
// Before, this nudged the playhead forward every 200 ms, which stuttered.
let _ffCheck = null;
function ffNudge(v) { try { v.currentTime = v.currentTime + 0.02; const p = v.play(); if (p) p.catch(()=>{}); } catch (e) {} }
function startFF() {
  const el = slotEls['0']; if (!el || !el._vid) return;
  const v = el._vid; holding = true;
  el.querySelector('.slide-media').classList.add('ffwd');
  if (v.paused && el.dataset.userPaused !== 'true') { const p = v.play(); if (p) p.catch(()=>{}); }
  const t0 = v.currentTime;
  try { v.playbackRate = 2; } catch (e) {}
  // Some WebKit builds freeze at 2x while pitch correction is on (seen in desktop test WebKit,
  // Nov 15 2026). If the picture has not moved shortly after, retry without pitch correction.
  clearTimeout(_ffCheck);
  _ffCheck = setTimeout(() => {
    if (!holding || el._vid !== v || v.paused || v.currentTime - t0 > 0.08 || v.currentTime < t0) return;
    try { v.preservesPitch = false; v.webkitPreservesPitch = false; v.playbackRate = 1; v.playbackRate = 2; } catch (e) {}
    ffNudge(v);
  }, 300);
}
function stopFF() {
  holding = false; clearTimeout(_ffCheck);
  if (ffTimer) { clearInterval(ffTimer); ffTimer = null; }
  const el = slotEls['0']; if (!el) return;
  el.querySelector('.slide-media').classList.remove('ffwd');
  const v = el._vid; if (!v) return;
  try { v.playbackRate = 1; } catch (e) {}
  const t1 = v.currentTime;
  setTimeout(() => { if (el._vid === v && !v.paused && slotEls['0'] === el && Math.abs(v.currentTime - t1) < 0.03) ffNudge(v); }, 350);
}

/* ---------- slide construction ---------- */
function buildSlide(item, i) {
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.id = item.id;
  el.innerHTML =
    '<div class="slide-media">' +
      '<img alt="" decoding="async">' +
      '<div class="status-badge"><div class="spinner"></div></div>' +
      '<div class="mask-bottom"></div><div class="mask-rail"></div>' +
      '<div class="pause-icon">&#10074;&#10074;</div>' +
      '<div class="tap-icon">&#9654;</div>' +
    '</div>' +
    '<div class="slide-overlay">' +
      '<div class="slide-author"></div>' +
      '<div class="slide-desc"></div>' +
      '<div class="slide-title">' + esc(itemLabel(item)) + '</div>' +
      '<div class="slide-cat">' + esc(catLine(item)) + '</div>' +
    '</div>' +

/* ============================================================
   PER-VIDEO SHEET: categories, delete, restore, purge
   ============================================================ */
function openCategorySheet(item) {
  const list = document.getElementById('sheetCats');
  list.innerHTML = '';
  const inTrash = item.category === DELETED;

  if (!inTrash) {
    orderedCats().forEach(oc => {
      const cat = oc.name;
      const r = document.createElement('div');
      r.className = 'sheet-cat' + (cat === item.category ? ' selected' : '');
      r.textContent = '\u2003'.repeat(oc.depth) + cat + (cat === item.category ? '  \u2713' : '');
      r.onclick = () => {
        item.category = cat; save();
        const el = slotEls['0'];
        if (el && el.dataset.id === item.id) el.querySelector('.slide-cat').textContent = catLine(item);
        closeSheet();
      };
      list.appendChild(r);
    });
  }
  const act = (label, cls, fn) => {
    const r = document.createElement('div');
    r.className = 'sheet-cat sheet-action' + (cls ? ' ' + cls : '');
    r.textContent = label; r.onclick = fn; list.appendChild(r);
  };
  if (inTrash) {
    act('Restore to Uncategorized','',() => { restoreVideo(item); closeSheet(); });
    act('Delete permanently','destructive',() => {
      closeSheet();
      confirmModal({ title:'Delete permanently?',
        message:'This removes the video from your library for good.',
        confirmLabel:'Delete', destructive:true, onConfirm:() => purgeVideo(item) });
    });
  } else {
    act(X.saved[item.id] ? 'Save a copy again (saved ' + formatDate(new Date(X.saved[item.id]).toISOString()) + ')' : 'Save a copy to keep', '', () => { closeSheet(); saveCopy(item); });
    if (senderOf(item.id) || item.category === SHARED_CAT) act(senderOf(item.id) ? 'Sent by ' + senderOf(item.id) + ' (change)' : 'Set who sent it', '', () => { closeSheet(); senderModal(item.id, false); });
    act('Delete','destructive',() => { deleteVideo(item); closeSheet(); });
  }
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
document.getElementById('sheetBackdrop').onclick = closeSheet;
document.getElementById('newCatBtn').onclick = () => {
  const inp = document.getElementById('newCatInput');
  const name = (inp.value || '').trim();
  if (!name || name === DELETED) return;
  if (!state.categories.includes(name)) state.categories.push(name);
  inp.value = '';
  save();
  const el = slotEls['0'];
  const item = feedList[curIndex];
  if (item) { item.category = name; if (el) el.querySelector('.slide-cat').textContent = catLine(item); }
  closeSheet();
};

function deleteVideo(item) {
  item.category = DELETED;
  if (!state.categories.includes(DELETED)) state.categories.push(DELETED);
  save(); dropFromCurrentViews(item); toast('Moved to Deleted');
}
function restoreVideo(item) {
  item.category = 'Uncategorized';
  if (!state.categories.includes('Uncategorized')) state.categories.unshift('Uncategorized');
  save(); dropFromCurrentViews(item); toast('Restored');
}
function purgeVideo(item) {
  state.items = state.items.filter(i => i.id !== item.id);
  state.purged = state.purged || [];
  if (!state.purged.includes(item.id)) state.purged.push(item.id);
  if (X.from[item.id]) { delete X.from[item.id]; saveX(); }
  flushSave();                    // irreversible: never leave it in a debounce window
  dropFromCurrentViews(item);
  toast('Deleted permanently');
}
function emptyDeleted() {
  const gone = state.items.filter(i => i.category === DELETED);
  if (!gone.length) { toast('Nothing to empty'); return; }
  confirmModal({ title:'Empty Deleted?',
    message: gone.length + ' video(s) will be removed for good.',
    confirmLabel:'Empty', destructive:true,
    onConfirm: () => {
      state.purged = state.purged || [];
      gone.forEach(i => { if (!state.purged.includes(i.id)) state.purged.push(i.id); });
      state.items = state.items.filter(i => i.category !== DELETED);
      flushSave();
      if (document.getElementById('gridView').classList.contains('open') && gridLabel === DELETED) {
        openGrid([], DELETED);
      }
      renderHome();
      toast('Deleted ' + gone.length);
    }});
}

// Remove a video from whatever the user is looking at right now.
function dropFromCurrentViews(item) {
  const gi = gridList.findIndex(x => x.id === item.id);
  if (gi >= 0) gridList.splice(gi, 1);
  if (document.getElementById('feed').classList.contains('open')) {
    feedDropCurrent(item.id);
  } else {
    const fi = feedList.findIndex(x => x.id === item.id);
    if (fi >= 0) feedList.splice(fi, 1);
  }
  if (document.getElementById('gridView').classList.contains('open')) {
    gridVL.setItems(gridList, gridVL.rowH);
    document.getElementById('gridEmpty').style.display = gridList.length ? 'none' : 'block';
  }
}

  if (navigator.share) { try { await navigator.share({ url }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch (e) { toast('Could not share on this device'); }
}
