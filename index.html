<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Favorites">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://www.tikwm.com" crossorigin>
<link rel="dns-prefetch" href="https://v16m.tiktokcdn-us.com">
<link rel="dns-prefetch" href="https://p16-common-sign.tiktokcdn-us.com">
<title>Favorites</title>
<style>
  :root {
    --bg:#000; --panel:#151515; --line:#242424;
    --text:#f2f2f2; --dim:#8a8a8a; --accent:#3b7dd8;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    overscroll-behavior:none;
  }
  button { font:inherit; color:inherit; }

  /* ===================== HOME ===================== */
  #verBadge { margin-top:22px; text-align:center; font-size:11px; color:#666; letter-spacing:.02em; }
  #home { padding:max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom)); }
  #allTile {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; margin-bottom:14px;
  }
  #allTile .name { font-size:17px; font-weight:600; }
  #allTile .count { font-size:13px; color:var(--dim); margin-top:3px; }
  #addLinkBtn {
    width:100%; margin-bottom:14px; padding:12px 16px; border-radius:12px;
    border:1px dashed var(--line); background:transparent; color:var(--accent);
    font-size:14px; font-weight:600; text-align:left;
  }
  #catGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat-tile {
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:16px 14px; min-height:78px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .cat-tile .name { font-size:15px; font-weight:600; padding-right:22px; word-break:break-word; }
  .cat-tile .count { font-size:12px; color:var(--dim); margin-top:6px; }
  .cat-tile.add { align-items:center; justify-content:center; color:var(--dim); border-style:dashed; }
  .cat-tile.trash { opacity:.72; }
  .cat-manage {
    position:absolute; top:6px; right:6px; background:none; border:0;
    color:var(--dim); font-size:16px; line-height:1; padding:6px 8px;
  }

  /* ===================== GRID ===================== */
  #gridView { position:fixed; inset:0; background:#000; display:none; flex-direction:column; z-index:15; }
  #gridView.open { display:flex; }
  .grid-top {
    display:flex; align-items:center; gap:10px;
    padding:max(14px,env(safe-area-inset-top)) 12px 8px;
  }
  .grid-title { font-size:15px; font-weight:600; flex:1; }
  .icon-btn {
    width:32px; height:32px; border-radius:50%; border:0;
    background:rgba(255,255,255,0.09); color:var(--text); font-size:15px; line-height:1;
  }
  #searchRow { display:none; align-items:center; gap:8px; padding:0 12px 8px; }
  #searchRow.open { display:flex; }
  #searchInput {
    flex:1; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:15px; padding:0 12px; outline:none;
  }
  #searchClear { width:34px; height:34px; border-radius:50%; border:0; background:rgba(255,255,255,.09); color:var(--text); font-size:18px; }
  #gridScroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  /* Virtualized: the container is sized to the whole library, but only the
     visible tiles exist in the DOM. */
  #thumbGrid { position:relative; width:100%; }
  .thumb-tile {
    position:absolute; overflow:hidden;
    background:linear-gradient(160deg,#232323,#111);
  }
  .thumb-tile img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .18s ease;
  }
  .thumb-tile img.loaded { opacity:1; }
  .thumb-date {
    position:absolute; left:4px; bottom:4px; font-size:9px;
    color:rgba(255,255,255,.75); background:rgba(0,0,0,.45);
    padding:1px 4px; border-radius:3px;
  }
  .thumb-tile.unavailable::after {
    content:'Unavailable'; position:absolute; top:6px; left:6px;
    font-size:9px; color:rgba(255,255,255,.6); background:rgba(0,0,0,.55);
    padding:2px 5px; border-radius:3px;
  }
  #gridEmpty { padding:40px 20px; text-align:center; color:var(--dim); font-size:14px; display:none; }

  /* date jump */
  #datePanel {
    position:absolute; left:0; right:0; bottom:0; background:#161616;
    border-top:1px solid var(--line); max-height:55vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .22s ease; z-index:16;
    padding-bottom:max(16px,env(safe-area-inset-bottom));
  }
  #datePanel.open { transform:translateY(0); }
  .date-panel-inner { padding:8px 12px; }
  .date-year-hdr {
    font-size:13px; font-weight:700; color:var(--accent);
    padding:12px 4px 6px; position:sticky; top:0; background:#161616;
  }
  .date-month-row {
    display:inline-flex; margin:3px; padding:7px 12px; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; font-size:13px;
  }

  /* ===================== FEED ===================== */
  #feed { position:fixed; inset:0; background:#000; display:none; flex-direction:column; z-index:20; }
  #feed.open { display:flex; }
  .feed-top {
    position:absolute; top:0; left:0; right:0; z-index:8;
    display:flex; align-items:center; gap:10px;
    padding:max(12px,env(safe-area-inset-top)) 12px 8px;
    background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);
  }
  .feed-label {
    flex:1; font-size:13px; font-weight:600; text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  /* No native scroll anywhere in the feed. The stage is a fixed viewport and the
     track holds exactly three slides (prev / current / next) that we move with a
     CSS transform in response to swipe gestures. This eliminates the entire class
     of native-scroll + scroll-snap + momentum bugs. */
  #stage { position:absolute; inset:0; overflow:hidden; touch-action:none; background:#000; }
  #track { position:absolute; left:0; top:0; width:100%; will-change:transform; }
  /* The cross-origin iframe would swallow all touches, so it never receives
     pointer events — we drive play/pause ourselves and capture every gesture on
     the stage. The rail buttons (z-index 7) stay interactive above everything. */
  .slide-media iframe { pointer-events:none; }
  .slide {
    position:absolute; left:0; width:100%; overflow:hidden;
  }
  .slide-media { position:absolute; inset:0; background:#0b0b0b; }
  /* Thumbnail sits ABOVE the iframe (z-index 2 vs 1) until the video is
     confirmed playing. On devices where autoplay is blocked this means the
     slide shows its thumbnail, never a black frame; once playing, .is-playing
     fades the thumbnail out to reveal the video underneath. */
  .slide-media img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .2s ease; z-index:2;
  }
  .slide-media img.loaded { opacity:1; }
  .slide-media.is-playing img { opacity:0; pointer-events:none; }
  .slide-media iframe { position:absolute; inset:0; width:100%; height:100%; border:0; z-index:1; }
  .slide-media video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#0b0b0b; z-index:1; pointer-events:none; }

  /* scrims hiding TikTok's own chrome; taps can't reach it regardless */
  .mask-bottom {
    position:absolute; left:0; right:0; bottom:0; height:96px; z-index:3;
    background:linear-gradient(to top,#000 0%,rgba(0,0,0,.9) 42%,rgba(0,0,0,0) 100%);
    pointer-events:none;
  }
  .mask-rail {
    position:absolute; right:0; bottom:96px; width:64px; height:250px; z-index:3;
    background:linear-gradient(to left,rgba(0,0,0,.82) 0%,rgba(0,0,0,.5) 55%,rgba(0,0,0,0) 100%);
    pointer-events:none;
  }
  /* full-surface tap interceptor: nothing reaches TikTok's player */

  .status-badge {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5;
    pointer-events:none; text-align:center; max-width:220px;
    font-size:12px; color:rgba(255,255,255,.5);
  }
  .spinner {
    width:26px; height:26px; border-radius:50%; margin:0 auto;
    border:2px solid rgba(255,255,255,.22); border-top-color:rgba(255,255,255,.75);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .slide-media.has-player .status-badge { display:none; }
  /* While a cold video is being resolved/buffered, keep the spinner up over the
     thumbnail so it reads as loading rather than frozen. */
  .slide-media.has-player.resolving .status-badge { display:block; }
  .slide-media.is-playing .status-badge { display:none; }
  .slide-media.paused .pause-icon,
  .slide-media.needs-tap .tap-icon { display:flex; }
  .pause-icon, .tap-icon {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:6;
    width:74px; height:74px; border-radius:50%; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center;
    font-size:30px; color:#fff; pointer-events:none;
  }
  .tap-icon {
    padding-left:6px; width:88px; height:88px; font-size:36px;
    background:rgba(0,0,0,.55); box-shadow:0 0 0 4px rgba(255,255,255,.14);
  }
  .slide-media.needs-tap::after {
    content:'Tap to play'; position:absolute; left:0; right:0; z-index:6;
    top:calc(50% + 62px); text-align:center; font-size:13px;
    color:rgba(255,255,255,.9); text-shadow:0 1px 3px rgba(0,0,0,.7);
    pointer-events:none;
  }
  .slide-media.ffwd::after {
    content:'\26A1 2\00D7'; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); z-index:7; font-size:19px; font-weight:700;
    color:#fff; background:rgba(0,0,0,.5); padding:6px 14px; border-radius:20px;
    pointer-events:none;
  }
  .slide-overlay {
    position:absolute; left:0; right:74px; bottom:max(26px,env(safe-area-inset-bottom));
    padding:0 16px; z-index:6; pointer-events:none;
    text-shadow:0 1px 4px rgba(0,0,0,.65);
  }
  .slide-author { font-size:15px; font-weight:700; margin-bottom:3px; }
  .slide-desc {
    font-size:13px; line-height:1.35; color:rgba(255,255,255,.95); margin-bottom:5px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .slide-desc.expanded { -webkit-line-clamp:unset; }
  .slide-overlay .slide-desc { pointer-events:auto; }
  .slide-title { font-size:12px; font-weight:600; color:rgba(255,255,255,.8); }
  .slide-cat { font-size:12px; color:rgba(255,255,255,.7); margin-top:1px; }
  .rail {
    position:absolute; right:10px; bottom:max(118px,calc(env(safe-area-inset-bottom) + 108px));
    display:flex; flex-direction:column; align-items:center; gap:16px; z-index:7;
  }
  .rail-btn {
    width:46px; height:46px; border-radius:50%; border:0;
    background:rgba(0,0,0,.5); color:var(--text); font-size:18px;
  }
  .rail-btn.active { background:var(--accent); }
  .rail-btn.blocked { background:#8a5a1f; }

  /* ===================== SHEETS / MODALS ===================== */
  #sheetBackdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:30; }
  #sheetBackdrop.open { display:block; }
  #sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:31; background:#1a1a1a;
    border-radius:16px 16px 0 0; padding:16px 16px max(20px,env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .22s ease; max-height:70vh; overflow-y:auto;
  }
  #sheet.open { transform:translateY(0); }
  .sheet-title { font-size:13px; color:var(--dim); margin-bottom:8px; }
  .sheet-cat { padding:12px 4px; border-bottom:1px solid #262626; font-size:15px; }
  .sheet-cat.selected { color:var(--accent); }
  .sheet-action { font-weight:600; }
  .sheet-action.destructive { color:#ff6b6b; }
  .sheet-new { display:flex; gap:8px; margin-top:14px; }
  .sheet-new input {
    flex:1; background:#101010; border:1px solid #2a2a2a; border-radius:8px;
    color:var(--text); padding:10px 12px; font-size:15px;
  }
  .sheet-new button { background:var(--accent); border:0; border-radius:8px; padding:0 16px; font-weight:600; }

  .modal-backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-card { background:#1c1c1c; border:1px solid var(--line); border-radius:14px; width:100%; max-width:320px; padding:18px; }
  .modal-title { font-size:16px; font-weight:600; margin-bottom:6px; }
  .modal-message { font-size:13px; color:var(--dim); margin-bottom:14px; }
  .modal-input {
    width:100%; background:#101010; border:1px solid #2a2a2a; border-radius:8px;
    color:var(--text); padding:10px 12px; font-size:15px; margin-bottom:6px;
  }
  .modal-error { font-size:12px; color:#ff6b6b; min-height:15px; }
  .modal-actions { display:flex; gap:8px; margin-top:10px; }
  .modal-btn { flex:1; border:0; border-radius:8px; padding:11px 0; font-size:14px; font-weight:600; background:#2a2a2a; }
  .modal-btn.primary { background:var(--accent); }
  .modal-btn.destructive { background:#4a2020; color:#ff8f8f; }

  .action-sheet {
    position:fixed; left:16px; right:16px; bottom:max(20px,env(safe-area-inset-bottom));
    z-index:41; background:#1c1c1c; border-radius:14px; overflow:hidden;
  }
  .action-sheet-title { font-size:12px; color:var(--dim); text-align:center; padding:12px; border-bottom:1px solid #262626; }
  .action-row { padding:14px; text-align:center; font-size:16px; border-bottom:1px solid #262626; }
  .action-row.destructive { color:#ff6b6b; }
  .action-row.cancel { font-weight:600; border-bottom:0; }

  #toast {
    position:fixed; top:max(16px,env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); background:#222; padding:8px 16px; border-radius:20px;
    font-size:13px; z-index:50; box-shadow:0 2px 10px rgba(0,0,0,.4); display:none;
  }
  #toast.show { display:block; }

  #debugLog {
    position:absolute; left:0; right:0; bottom:0; max-height:38vh; overflow-y:auto;
    margin:0; padding:8px 10px; background:rgba(0,0,0,.82); color:#5f5;
    font-family:ui-monospace,monospace; font-size:10px; line-height:1.35;
    z-index:40; white-space:pre-wrap; pointer-events:none; display:none;
  }
  #debugLog.show { display:block; }
</style>
</head>
<body>

<div id="home">
  <div id="allTile"><div class="name">All Videos</div><div class="count" id="allCount">Loading…</div></div>
  <button id="addLinkBtn">＋ Add a shared link</button>
  <div id="catGrid"></div>
  <div id="verBadge"></div>
</div>

<div id="gridView">
  <div class="grid-top">
    <button class="icon-btn" id="gridBack">&lsaquo;</button>
    <div class="grid-title" id="gridTitle">All Videos</div>
    <button class="icon-btn" id="searchBtn" aria-label="Search">&#128269;</button>
    <button class="icon-btn" id="dateJumpBtn" style="display:none">&#128197;</button>
  </div>
  <div id="searchRow"><input id="searchInput" type="search" autocomplete="off" autocapitalize="off" placeholder="Search creator or description…"><button id="searchClear" aria-label="Clear">&times;</button></div>
  <div id="gridScroll"><div id="thumbGrid"></div><div id="gridEmpty">Nothing here yet.</div></div>
  <div id="datePanel"><div class="date-panel-inner" id="datePanelInner"></div></div>
</div>

<div id="feed">
  <div class="feed-top">
    <button class="icon-btn" id="feedBack">&lsaquo;</button>
    <div class="feed-label" id="feedLabel">All Videos</div>
    <button class="icon-btn" id="debugToggle">&#128027;</button>
  </div>
  <div id="stage"><div id="track"></div></div>
  <pre id="debugLog"></pre>
</div>

<div id="sheetBackdrop"></div>
<div id="sheet">
  <div class="sheet-title">Move to category</div>
  <div id="sheetCats"></div>
  <div class="sheet-new"><input id="newCatInput" placeholder="New category"><button id="newCatBtn">Add</button></div>
</div>

<div id="toast"></div>

<script>
'use strict';
var APP_VERSION = 2, APP_BUILT = 'Nov 14 11:38 PM';   // stamped by _dev/tools/release.py

/* ============================================================
   DATA
   ============================================================ */
const DELETED = 'Deleted';
const DATA_VERSION = 5;

let state = null;
try { state = JSON.parse(localStorage.getItem('gallery-state') || 'null'); } catch (e) { state = null; }

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function formatDate(iso) {
  const d = new Date(String(iso).replace(' ','T'));
  return isNaN(d) ? '' : d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function itemLabel(it) { return it.date ? formatDate(it.date) : ''; }
function itemUrl(it) { return 'https://www.tiktok.com/@i/video/' + it.id; }
function liveItems() { return state.items.filter(i => i.category !== DELETED); }

let saveTimer = null;
function save() { if (!saveTimer) saveTimer = setTimeout(flushSave, 400); }
function flushSave(now) {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  let json = '';
  try { json = JSON.stringify(state); localStorage.setItem('gallery-state', json); }
  catch (e) {
    // The thumbnail cache is rebuildable; drop it to make room for real data.
    try { freeLegacyStorage();
          localStorage.setItem('gallery-state', json); }
    catch (e2) { toast('Storage full — change may not be saved'); }
  }
  mirrorState(now === true);
}
// v2: a second copy of the organizing work, kept outside localStorage (IndexedDB). If
// localStorage ever comes back empty, boot() restores from it instead of rebuilding
// from favorites.json and silently losing every category. Written at most every 15 s
// and when the app is hidden; never written from an empty or half-built state.
let _mirrorAt = 0, _mirrorTimer = null;
function mirrorState(now) {
  const write = () => {
    _mirrorTimer = null; _mirrorAt = Date.now();
    if (state && state.hydrated && state.items && state.items.length) { try { LIB.putSnap(JSON.stringify(state)); } catch (e) {} }
  };
  if (now) { if (_mirrorTimer) clearTimeout(_mirrorTimer); write(); return; }
  if (!_mirrorTimer) _mirrorTimer = setTimeout(write, Math.max(0, 15000 - (Date.now() - _mirrorAt)));
}
window.addEventListener('pagehide', () => flushSave(true));
window.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(true); });

async function boot() {
  if (!state) {
    try {
      const s = await LIB.getSnap(); const st = s && s.json ? JSON.parse(s.json) : null;
      if (st && st.items && st.items.length) {
        state = st;
        try { localStorage.setItem('gallery-state', s.json); } catch (e) {}
        toast('Restored your categories from the backup copy');
      }
    } catch (e) {}
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  const fresh = !state || state.version !== DATA_VERSION || !state.hydrated;
  if (!fresh) { handleIncomingAdd(); renderHome(); return; }
  document.getElementById('allCount').textContent = 'Loading…';
  try {
    const raw = await (await fetch('favorites.json')).json();
    const prev = {};
    if (state && state.items) state.items.forEach(i => { prev[i.id] = i; });
    const purged = new Set((state && state.purged) || []);
    const cats = ((state && state.categories) || []).slice();
    const items = raw.filter(e => !purged.has(e.id)).map(e => ({
      id: e.id,
      date: e.date,
      category: (prev[e.id] && prev[e.id].category) || 'Uncategorized'
    }));
    if (!cats.includes('Uncategorized')) cats.unshift('Uncategorized');
    if (items.some(i => i.category === DELETED) && !cats.includes(DELETED)) cats.push(DELETED);
    state = { categories: cats, items, hydrated: true, version: DATA_VERSION, purged: [...purged] };
    flushSave();
  } catch (e) {
    console.error('favorites.json failed to load', e);
    state = state || { categories:['Uncategorized'], items:[], hydrated:false, version:DATA_VERSION, purged:[] };
  }
  handleIncomingAdd();
  renderHome();
  startHarvest();   // begin filling search metadata for the whole library
}

const SHARED_CAT = 'Shared with me';
// Add a video (by id) into the "Shared with me" category. Returns true if it
// resulted in a change worth re-rendering.
function addSharedVideo(id) {
  if (!id) return false;
  id = String(id);
  const existing = state.items.find(i => i.id === id);
  if (existing) {
    if (existing.category === DELETED || existing.category === 'Uncategorized') existing.category = SHARED_CAT;
    else { toast('Already in your library'); return true; }
  } else {
    state.items.unshift({ id, date: new Date().toISOString().replace('T',' ').slice(0,19), category: SHARED_CAT });
  }
  if (!state.categories.includes(SHARED_CAT)) state.categories.unshift(SHARED_CAT);
  flushSave();
  toast('Added to “Shared with me”');
  return true;
}
// Accepts any TikTok link the user pastes/shares. If the numeric id is in the
// URL we use it directly; otherwise (short vt.tiktok.com/... links) we ask the
// resolver to expand it. Files the result into "Shared with me".
function addSharedLink(raw, onDone) {
  raw = String(raw || '').trim();
  if (!raw) { onDone && onDone(false); return; }
  const direct = raw.match(/\/video\/(\d+)/) || raw.match(/^(\d{6,25})$/);
  if (direct) { const ch = addSharedVideo(direct[1]); startHarvest(); onDone && onDone(ch); return; }
  toast('Reading shared link…');

/* ============================================================
   THUMBNAILS
   A failed fetch must NEVER permanently brand a video unavailable:
   TikTok rate-limits, and its thumbnail URLs expire between sessions.
   Only an explicit "this video is gone" response is treated as final,
   and even that is re-checked after a day.

const THUMB_TTL   = 6 * 60 * 60 * 1000;   // fallback lifetime for a cover URL whose own expiry can't be read

/* ---- persistent caches (victor): IndexedDB instead of localStorage ----
   localStorage is capped at ~5 MB per site and the caption index alone outgrows
   it, so the caches now live in IndexedDB (hundreds of MB on iOS) and each entry
   saves on its own, instead of re-serialising megabytes every 3 s. The user's
   categories ('gallery-state') stay in localStorage, now with plenty of room.
   If IndexedDB is unavailable, everything falls back to the old localStorage
   behaviour. */
const KV = (() => {
  let dbp = null, ok = typeof indexedDB !== 'undefined';
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      let r; try { r = indexedDB.open('favorites-kv', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => { const d = r.result; ['thumb', 'meta', 'rv'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
      r.onsuccess = () => res(r.result);

      const out = {}; const tx = d.transaction(store, 'readonly');
      const req = tx.objectStore(store).openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);

      const tx = d.transaction(store, 'readwrite'); const os = tx.objectStore(store);
      puts.forEach(([k, v]) => os.put(v, k)); dels.forEach(k => os.delete(k));
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);

// A plain object whose writes/deletes are remembered, so only changed entries are saved.
function trackedStore(initial) {

    set(t, k, v) { t[k] = v; dirty.add(k); return true; },
    deleteProperty(t, k) { delete t[k]; dirty.add(k); return true; }

const LIB = (() => {
  let dbp = null; const have = new Set(), urls = new Map(), saving = new Map(); let failed = 0;

      let r; try { r = indexedDB.open('favorites-lib', 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => { const d = r.result; ['cover', 'snap'].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
    });

  function remember(id, buf, type) {            // small LRU of object URLs for images on screen

const _thumbTS = trackedStore(legacyLoad('thumb-cache'));
let thumbCache = _thumbTS.obj;
const thumbReady = hydrateTracked('thumb', _thumbTS, 'thumb-cache');

let cacheDirty = false;
setInterval(() => {
  cacheDirty = false;
  flushTracked('thumb', _thumbTS, 'thumb-cache');
}, 3000);

const pending = new Map();      // id -> {id, priority(), cbs:[]}
const inflight = new Map();     // id -> AbortController
let activeFetches = 0;
let failStreak = 0;
let backoffUntil = 0;

function cachedThumb(id) {
  const e = thumbCache[id];
  if (!e) return null;
  if (e.gone) return (Date.now() - e.t < GONE_TTL) ? { gone: true } : null;
  if (Date.now() > (e.x ? e.x - 300000 : e.t + THUMB_TTL)) return null;      // stale URL, refetch
  return { url: e.u };
}

let _libLoaded = false; LIB.ready.then(() => { _libLoaded = true; });
function requestThumb(id, cb, priority) {
  if (!_libLoaded) { LIB.ready.then(() => requestThumb(id, cb, priority)); return; }
  if (LIB.has(id)) {                       // v2: the image is already on the phone, no network
    LIB.coverUrl(id).then(u => {
      if (!u) { requestThumbRemote(id, cb, priority); return; }
      cb({ url: u });
      if (isGone(id)) cb({ gone: true });
    });
    return;
  }
  requestThumbRemote(id, cb, priority);
}
function requestThumbRemote(id, cb, priority) {
  const hit = cachedThumb(id);
  if (hit && hit.gone) { cb(hit); return; }
  // a still-valid link from an earlier visit: fetch it once, keep the bytes, show the stored copy
  if (hit) { LIB.saveCover(id, hit.url).then(u => cb({ url: u || hit.url })); return; }
  const ex = pending.get(id);
  if (ex) { ex.cbs.push(cb); ex.warm = false; return; }
  pending.set(id, { id, cbs: [cb], priority: priority || (() => 0) });
  schedulePump();
}
// v2: covers no longer need the resolver once stored, so nothing else would get the
// videos on screen ready to play. While a grid is showing, quietly resolve the ones
// whose cover is local but whose video link is missing or expired (closest first,
// dropped when the tile scrolls away, paused while the feed is open).
function warmPlay(id, priority) {
  LIB.ready.then(() => {
    if (!LIB.has(id) || cacheGet(id) || pending.has(id) || isGone(id)) return;
    pending.set(id, { id, cbs: [], priority: priority || (() => 0), warm: true });
    schedulePump();
  });
}

function dropThumbRequest(id) {
  const p = pending.get(id);
  if (p) pending.delete(id);
  const c = inflight.get(id);
  if (c) { c.abort(); inflight.delete(id); }

let pumpScheduled = false;
function schedulePump() {
  if (pumpScheduled) return;
  pumpScheduled = true;
  // Deferred so an entire batch of newly visible tiles is queued before any
  // fetch starts — otherwise arrival order wins and priority never applies.
  setTimeout(() => { pumpScheduled = false; pump(); }, 0);
}

function pump() {
  // xray: never spend the resolver budget on thumbnails while a video is on screen
  if (document.getElementById('feed').classList.contains('open')) { setTimeout(schedulePump, 1000); return; }
  if (Date.now() < backoffUntil) {
    setTimeout(schedulePump, backoffUntil - Date.now() + 20);
    return;
  }
  while (activeFetches < MAX_INFLIGHT && pending.size) {
    let best = null, bestP = Infinity;
    pending.forEach(p => { const v = p.priority(); if (v < bestP) { bestP = v; best = p; } });
    if (!best) break;
    pending.delete(best.id);
    startFetch(best);
  }

function startFetch(req) {
  // xray (Nov 15 2026): TikTok's oEmbed stopped returning thumbnail_url / author / title
  // (it now answers with only the id), so thumbnails and captions come from the
  // resolver's cover + metadata instead, at low priority behind the feed. Bonus: the
  // video URL gets cached too, so a tapped thumbnail plays at once.
  if (req.warm && cacheGet(req.id)) { schedulePump(); return; }   // already playable
  activeFetches++;
  inflight.set(req.id, { abort() { cancelThumbResolve(req.id); } });
  resolveForThumb(req.id)
    .then(r => {
      if (r === 'dropped') return { retry: true };            // pruned for the feed; try again later
      if (r && r.gone) return { gone: true };                 // remembered by markGone()
      if (r && r.cover) {
        thumbCache[req.id] = { u: r.cover, t: Date.now(), x: coverExpiry(r.cover) };

        // v2: keep the bytes; show the stored copy (falls back to the link if storing failed)
        return LIB.saveCover(req.id, r.cover).then(u => ({ url: u || r.cover }));
      }
      return null;                                            // resolver couldn't: leave the date tile
    })
    .then(result => {
      if (result) req.cbs.forEach(cb => { try { cb(result); } catch (e) {} });
    })
    .finally(() => {
      inflight.delete(req.id);
      activeFetches--;
      schedulePump();
    });

// Binds a thumbnail to an <img>, surviving the two ways TikTok fails us:
//  - a transient failure (throttling, flaky network) -> retry with backoff,
//    because a tile that stays on screen would otherwise never load again;
//  - an expired cached URL -> the image fails to decode, so refetch it once.
function bindThumb(imgEl, id, priority, onGone) {
  let urlRetried = false, attempts = 0;
  const alive = () => imgEl.parentNode !== null;

  const apply = (r) => {
    if (!alive()) return;
    if (r.gone) { if (onGone) onGone(); return; }
    if (r.retry) {
      // Try again while this tile is still on screen, backing off each time.
      if (++attempts > 6) return;
      setTimeout(() => { if (alive()) requestThumb(id, apply, priority); },
                 Math.min(20000, 700 * Math.pow(2, attempts)));
      return;
    }
    imgEl.onerror = () => {
      if (urlRetried) return;
      urlRetried = true;
      delete thumbCache[id]; cacheDirty = true;   // the signed URL expired
      requestThumb(id, apply, priority);
    };
    imgEl.onload = () => imgEl.classList.add('loaded');
    imgEl.src = r.url;
  };
  requestThumb(id, apply, priority);
}

/* ============================================================
   VIRTUAL LIST
   Only the visible window exists in the DOM, so cost is constant
   whether the library holds 30 videos or 6,070.
   ============================================================ */
function VirtualList(opts) {
  const { scroller, content, perRow, overscan } = opts;
  const self = {
    items: [], rowH: 0, perRow: perRow || 1, overscan: overscan == null ? 2 : overscan,
    live: new Map(), range: [-1,-1], onRange: null
  };
  self.rows = () => Math.ceil(self.items.length / self.perRow);
  self.totalHeight = () => self.rows() * self.rowH;

  self.setItems = (items, rowH) => {
    self.items = items;
    if (rowH) self.rowH = rowH;
    self.live.forEach(el => el.remove());
    self.live.clear();
    self.range = [-1,-1];
    content.style.height = self.totalHeight() + 'px';
    self.update(true);
  };

  self.indexAtScroll = () => Math.round(scroller.scrollTop / Math.max(1, self.rowH)) * self.perRow;

  self.update = (force) => {
    if (!self.rowH) return;
    const first = Math.max(0, Math.floor(scroller.scrollTop / self.rowH) - self.overscan);
    const last  = Math.min(self.rows() - 1,
                  Math.ceil((scroller.scrollTop + scroller.clientHeight) / self.rowH) + self.overscan);
    if (!force && first === self.range[0] && last === self.range[1]) return;
    self.range = [first, last];

    const need = new Set();
    for (let r = first; r <= last; r++) {
      for (let c = 0; c < self.perRow; c++) {
        const i = r * self.perRow + c;
        if (i < self.items.length) need.add(i);
      }
    }
    self.live.forEach((el, i) => {
      if (!need.has(i)) { opts.recycle && opts.recycle(el, i); el.remove(); self.live.delete(i); }
    });
    need.forEach(i => {
      if (self.live.has(i)) return;
      const el = opts.render(self.items[i], i);
      const r = Math.floor(i / self.perRow), c = i % self.perRow;
      el.style.top = (r * self.rowH) + 'px';
      if (self.perRow > 1) {
        el.style.left = (c * (100 / self.perRow)) + '%';
        el.style.width = (100 / self.perRow) + '%';
      }
      el.style.height = (opts.itemHeight || self.rowH) + 'px';
      content.appendChild(el);
      self.live.set(i, el);
    });
    if (self.onRange) self.onRange();
  };

  self.scrollToIndex = (i) => {
    scroller.scrollTop = Math.floor(i / self.perRow) * self.rowH;
    self.update(true);
  };
  self.get = (i) => self.live.get(i);
  return self;
}

                  '<div class="count">' + n + ' saved</div>';

    return;
  }
  actionSheet({ title: cat, rows: [

    { label:'Delete category', destructive:true, onClick: () => confirmDeleteCategory(cat) }
  ]});
}

  inputModal({ title:'Rename "' + cat + '"', placeholder:'New name', initialValue:cat, confirmLabel:'Save',
    onSubmit: (name) => {
      if (name === DELETED) return 'That name is reserved.';
      if (name !== cat && state.categories.includes(name)) return 'That category already exists.';

function confirmDeleteCategory(cat) {

  document.getElementById('gridEmpty').style.display = list.length ? 'none' : 'block';
  setupDateJump(list, label);
  gridVL.setItems(list, gridRowHeight());
  const saved = gridScrollMemory[label] || 0;
  gridScroll.scrollTop = saved;
  gridVL.update(true);
  startHarvest();   // resume filling search metadata while browsing the library
}

// ---- Search over creator / description / category / date ----
// Searches the metadata store (populated as videos are browsed/played) plus the
// always-known fields (category, date). Filters the current grid's base list and
// re-renders through the same virtualized grid, so tapping a result opens the
// feed exactly as normal.
function matchSearch(item, q) {
  if (item.category && item.category.toLowerCase().includes(q)) return true;
  const lbl = itemLabel(item); if (lbl && lbl.toLowerCase().includes(q)) return true;
  const m = metaStore[item.id]; if (!m) return false;
  return (m.author && m.author.toLowerCase().includes(q)) ||
         (m.handle && m.handle.toLowerCase().includes(q)) ||
         (m.desc   && m.desc.toLowerCase().includes(q));
}
function runSearch(qRaw) {
  const q = (qRaw || '').trim().toLowerCase();
  const list = q ? gridBaseList.filter(it => matchSearch(it, q)) : gridBaseList;
  gridList = list;
  const empty = document.getElementById('gridEmpty');
  empty.textContent = q && !list.length ? 'No matches (metadata fills in as you browse).' : 'Nothing here yet.';
  empty.style.display = list.length ? 'none' : 'block';
  gridVL.setItems(list, gridRowHeight());
  gridScroll.scrollTop = 0;
  gridVL.update(true);
}
document.getElementById('searchBtn').onclick = () => {
  const row = document.getElementById('searchRow');
  const open = row.classList.toggle('open');
  if (open) { document.getElementById('searchInput').focus(); }
  else { document.getElementById('searchInput').value = ''; runSearch(''); }
};
document.getElementById('searchInput').addEventListener('input', (e) => runSearch(e.target.value));
document.getElementById('searchClear').onclick = () => { const si=document.getElementById('searchInput'); si.value=''; si.focus(); runSearch(''); };

gridScroll.addEventListener('scroll', () => {
  gridScrollMemory[gridLabel] = gridScroll.scrollTop;
  gridVL.update();
}, { passive:true });

document.getElementById('gridBack').onclick = () => {
  document.getElementById('gridView').classList.remove('open');
  document.getElementById('datePanel').classList.remove('open');
  gridVL.setItems([], gridVL.rowH);
  renderHome();
};

/* ---- date jump ---- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function setupDateJump(list, label) {
  const btn = document.getElementById('dateJumpBtn');
  const show = (label === 'All Videos' || label === 'Uncategorized') && list.length > 0;
  btn.style.display = show ? '' : 'none';
  document.getElementById('datePanel').classList.remove('open');
  if (!show) return;
  const index = [];
  let key = '';
  list.forEach((it, i) => {
    if (!it.date) return;
    const d = new Date(String(it.date).replace(' ','T'));
    if (isNaN(d)) return;
    const k = d.getFullYear() + '-' + d.getMonth();
    if (k !== key) { index.push({ y:d.getFullYear(), m:d.getMonth(), i }); key = k; }
  });
  const inner = document.getElementById('datePanelInner');
  inner.innerHTML = '';
  let year = null;
  index.forEach(e => {
    if (e.y !== year) {
      year = e.y;
      const h = document.createElement('div');
      h.className = 'date-year-hdr'; h.textContent = year;
      inner.appendChild(h);
    }
    const c = document.createElement('span');
    c.className = 'date-month-row'; c.textContent = MONTHS[e.m];
    c.onclick = () => {
      document.getElementById('datePanel').classList.remove('open');
      gridVL.scrollToIndex(e.i);   // O(1) with virtualization — no mass rendering
    };
    inner.appendChild(c);
  });
}
document.getElementById('dateJumpBtn').onclick = () =>
  document.getElementById('datePanel').classList.toggle('open');

/* ============================================================
   FEED — transform carousel (NO native scroll).
   The stage is a fixed viewport. A track holds exactly three slides
   (previous / current / next), positioned by an absolute transform. Swiping
   drags the track with the finger; on release it either advances one video or
   snaps back, animated with a CSS transition. There is no scroll container, no
   scroll-snap, no momentum, no spacers, no scrollTop — so the whole class of
   "racing / stuck between videos" bugs cannot occur. Only 3 videos are ever in
   the DOM regardless of library size.
   ============================================================ */
const stage = document.getElementById('stage');
const track = document.getElementById('track');
let feedList = [], feedLabel = '';
let curIndex = -1;               // index of the currently-shown video
let desiredMuted = true;
let audioUnlocked = false;   // set true on the first unmute tap (a real gesture); persists sound across swipes

// slot elements: slots[-1]=prev, slots[0]=current, slots[1]=next (by offset)
let slotEls = { '-1': null, '0': null, '1': null };
let stageH = 0;
let dragging = false, dragStartY = 0, dragDY = 0, dragStartT = 0, dragMoved = false;
let animating = false;
let holdTimer = null, ffTimer = null, holding = false;

function stageHeight() { return stage.clientHeight || window.innerHeight || 700; }

function setTrack(y, animate) {
  track.style.transition = animate ? 'transform .26s cubic-bezier(.22,.61,.36,1)' : 'none';
  track.style.transform = 'translate3d(0,' + y + 'px,0)';
}

// Base offset that centres the current slide: slots are laid at rows -1,0,1
// (pixel tops -H, 0, H), and the track is translated 0, so the row-0 slide fills
// the stage. We translate by -dragDY during a drag (drag up = negative dy shows next).
function layoutSlots() {
  stageH = stageHeight();
  ['-1','0','1'].forEach(k => {
    const el = slotEls[k];
    if (!el) return;
    el.style.height = stageH + 'px';
    el.style.top = (Number(k) * stageH) + 'px';
  });
}

function openFeed(list, label, startIndex) {
  feedList = list.slice(); feedLabel = label;
  document.getElementById('feedLabel').textContent = label;
  document.getElementById('feed').classList.add('open');
  curIndex = Math.max(0, Math.min(startIndex || 0, list.length - 1));
  buildAllSlots();
  layoutSlots();
  setTrack(0, false);
  // Opening the feed is a deliberate tap on a specific video, so load it
  // promptly — only a short settle, unlike the longer dwell used for swipes.
  scheduleCurrentPlayer(120);
}

document.getElementById('feedBack').onclick = () => {
  if (dwellTimer) { clearTimeout(dwellTimer); dwellTimer = null; }
  clearResolveQueue();   // stop resolver work so it doesn't compete with the library's thumbnail loading
  ['-1','0','1'].forEach(k => { if (slotEls[k]) destroyPlayer(slotEls[k]); });
  track.innerHTML = '';
  slotEls = { '-1': null, '0': null, '1': null };
  document.getElementById('feed').classList.remove('open');
  curIndex = -1;
  openGrid(gridList, gridLabel);
};

function indexForOffset(off) { return curIndex + off; }

function buildAllSlots() {
  // Destroy existing players/timers FIRST — wiping track.innerHTML detaches the
  // elements but does NOT stop their _playTimer/_readyWatchdog intervals (plain
  // JS timers, no DOM lifecycle tie), which would keep firing on orphaned
  // elements. Hit whenever this runs with a live player present (e.g.
  // feedDropCurrent — deleting the currently-open video).
  ['-1','0','1'].forEach(k => { if (slotEls[k]) destroyPlayer(slotEls[k]); });
  track.innerHTML = '';
  slotEls = { '-1': null, '0': null, '1': null };
  ['-1','0','1'].forEach(k => {
    const idx = curIndex + Number(k);
    if (idx < 0 || idx >= feedList.length) return;
    const el = buildSlide(feedList[idx], idx);
    el.dataset.slot = k;
    track.appendChild(el);
    slotEls[k] = el;
  });
  layoutSlots();
}

// Advance the carousel by +1 (next) or -1 (prev), recycling slots so only three
// Advance by ±1. Recycle the existing slot elements instead of rebuilding them,
// so the video you swiped to — which was already preloaded — keeps its player
// and starts instantly, rather than being destroyed and recreated (a recreate
// loses any warm autoplay state and causes a visible reload).
function commitAdvance(dir) {
  const newIndex = curIndex + dir;
  if (newIndex < 0 || newIndex >= feedList.length) { setTrack(0, true); return; }
  if (slotEls['0']) pauseSlide(slotEls['0']);

  const old = { '-1': slotEls['-1'], '0': slotEls['0'], '1': slotEls['1'] };
  const next = { '-1': null, '0': null, '1': null };

  if (dir === 1) {
    // moving forward: old next becomes current, old current becomes prev.
    // Only the FAR edge leaves the window — release its pooled video. The other
    // two keep their (preloaded) videos, so the incoming current is already
    // buffered and plays instantly.
    if (old['-1']) { unmountSlot(old['-1']); dropThumbRequest(old['-1'].dataset.id); old['-1'].remove(); }
    next['-1'] = old['0'];
    next['0']  = old['1'];
    curIndex = newIndex;
    next['1'] = makeSlotSlide(curIndex + 1);
  } else {
    if (old['1']) { unmountSlot(old['1']); dropThumbRequest(old['1'].dataset.id); old['1'].remove(); }
    next['1']  = old['0'];
    next['0']  = old['-1'];
    curIndex = newIndex;
    next['-1'] = makeSlotSlide(curIndex - 1);
  }

  slotEls = next;
  ['-1','0','1'].forEach(k => { if (slotEls[k]) slotEls[k].dataset.slot = k; });
  layoutSlots();
  setTrack(0, false);
  // Promote the already-preloaded new current immediately (instant play), then
  // mount/preload the newly-exposed edge after a short settle so fast flicks
  // don't fire a burst of resolves.
  promoteCurrent();
  scheduleCurrentPlayer(DWELL_MS);
}

function promoteCurrent() {
  const el = slotEls['0']; if (!el) return;
  const it = feedList[curIndex];
  if (it) { const c = el.querySelector('.slide-cat'); if (c) c.textContent = it.category; }
  fillOverlay(el, el.dataset.id);   // refresh creator/description from cache on activate
  el._becameCurrentAt = Date.now(); el._diag = [];
  if (el._vid && el._vidId === el.dataset.id) {
    // preloaded neighbour promoted — just play it
    delete el.dataset.userPaused;
    el._vid.muted = desiredMuted || !audioUnlocked;
    const p = el._vid.play(); if (p) p.catch(()=>{});
  } else {
    mountSlot(el, true);
  }
  ensurePlaying(el);
}

// One debounce timer, shared across the whole feed, cleared on every swipe.
let dwellTimer = null;
const DWELL_MS = 250;     // settle before mounting/preloading the new edge slide
function scheduleCurrentPlayer(delay) {
  if (dwellTimer) { clearTimeout(dwellTimer); dwellTimer = null; }
  const target = slotEls['0'];
  if (!target) return;
  dwellTimer = setTimeout(() => {
    dwellTimer = null;
    if (slotEls['0'] !== target) return;
    if (!document.getElementById('feed').classList.contains('open')) return;
    playCurrent();
  }, delay);
}

// Build a slide for an absolute index and insert it into the track (or return
// null if out of range). Used to fill the newly-exposed edge slot on advance.
function makeSlotSlide(idx) {
  if (idx < 0 || idx >= feedList.length) return null;
  const el = buildSlide(feedList[idx], idx);
  track.appendChild(el);
  return el;
}

// Run fn after the next paint. Setting an iframe's src in the same frame the
// slide's position/visibility just changed makes the browser silently drop the
// load, so player creation must wait one paint. A SINGLE rAF is the minimum
// paint-aligned path iOS needs for the muted-autoplay grant; a setTimeout
// backstop guarantees fn still runs in a later task if rAF is ever starved
// (tab backgrounded, Low Power Mode) — which would otherwise leave the video
// permanently unloaded. Kept to one frame (not two) because every extra tick
// between the swipe gesture and the src assignment is time iOS's separate,
// stricter "audible autoplay needs a recent user gesture" check can run out
// on — unlike the muted-autoplay grant, that one appears to require the
// navigation to still read as gesture-adjacent, not just post-paint.
function deferToPaint(fn) {
  let done = false;
  const run = () => { if (done) return; done = true; fn(); };
  requestAnimationFrame(run);
  setTimeout(run, 80);
}

function playCurrent() {
  const el = slotEls['0'];
  if (!el) return;
  // Update the caption immediately (cheap, and it should never wait for a paint).
  const it = feedList[curIndex];
  if (it) { const c = el.querySelector('.slide-cat'); if (c) c.textContent = it.category; }

  // After a paint, mount current (playing) + both neighbours (preloaded, paused)
  // so the next swipe in either direction promotes an already-buffered element.
  deferToPaint(() => {
    if (slotEls['0'] !== el) return;
    if (!document.getElementById('feed').classList.contains('open')) return;
    if (!el._becameCurrentAt) el._becameCurrentAt = Date.now();
    syncSlots();
    ensurePlaying(el);
  });
}

/* ---------- gestures on the stage ---------- */
stage.addEventListener('pointerdown', (e) => {
  if (animating) return;
  dragging = true; dragMoved = false;
  dragStartY = e.clientY; dragDY = 0; dragStartT = Date.now();
  setTrack(0, false);
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { if (!dragMoved) startFF(); }, 350);
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});

stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  dragDY = e.clientY - dragStartY;
  if (Math.abs(dragDY) > 8) { dragMoved = true; clearTimeout(holdTimer); if (holding) stopFF(); }
  if (holding) return;
  let dy = dragDY;
  // resist at the ends (no prev before 0, no next after last)
  if (curIndex === 0 && dy > 0) dy *= 0.3;
  if (curIndex === feedList.length - 1 && dy < 0) dy *= 0.3;
  setTrack(dy, false);
});

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  clearTimeout(holdTimer);
  if (holding) { stopFF(); return; }
  const dt = Date.now() - dragStartT;
  const H = stageHeight();
  // a tap: little movement, short time → toggle play/pause
  if (!dragMoved && dt < 400) { toggleCurrent(); setTrack(0, false); return; }
  const threshold = H * 0.18;
  const fast = Math.abs(dragDY) > 60 && dt < 250;
  if (dragDY < 0 && (Math.abs(dragDY) > threshold || fast) && curIndex < feedList.length - 1) {
    animating = true;
    setTrack(-H, true);
    afterTransition(() => { animating = false; commitAdvance(1); });
  } else if (dragDY > 0 && (Math.abs(dragDY) > threshold || fast) && curIndex > 0) {
    animating = true;
    setTrack(H, true);
    afterTransition(() => { animating = false; commitAdvance(-1); });

    setTrack(0, true);   // snap back
  }
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', () => { dragging = false; clearTimeout(holdTimer); if (holding) stopFF(); setTrack(0, true); });

function afterTransition(fn) {
  let done = false;
  const h = () => { if (done) return; done = true; track.removeEventListener('transitionend', h); fn(); };
  track.addEventListener('transitionend', h);
  setTimeout(h, 360);   // fallback in case transitionend doesn't fire
}

/* ---------- tap play/pause + hold fast-forward ---------- */
function toggleCurrent() {
  const el = slotEls['0']; if (!el) return;
  const media = el.querySelector('.slide-media');
  if (el.classList.contains('unavailable-slide')) {
    // v2: a tap re-checks a video that was remembered as unavailable
    el.classList.remove('unavailable-slide'); delete thumbCache[el.dataset.id]; cacheDirty = true;
    const sb = media.querySelector('.status-badge'); if (sb) sb.innerHTML = '<div class="spinner"></div>';
  }
  const v = el._vid;
  if (media.classList.contains('needs-tap') || !v) {
    // Manual recovery: re-resolve and try again. Clear any cached-but-dead URL.
    media.classList.remove('needs-tap');
    cacheDrop(el.dataset.id);
    el._vidId = null;
    mountSlot(el, true); ensurePlaying(el);
    return;
  }
  if (!v.paused) {
    el.dataset.userPaused = 'true'; v.pause(); el._state = 2; media.classList.add('paused');
  } else {
    delete el.dataset.userPaused;
    v.muted = desiredMuted || !audioUnlocked;
    const p = v.play(); if (p) p.catch(()=>{});
    media.classList.remove('paused');
  }
}

function startFF() {
  const el = slotEls['0']; if (!el) return;
  holding = true;
  el.querySelector('.slide-media').classList.add('ffwd');
  ffTimer = setInterval(() => {
    const v = el._vid;
    if (v && v.duration) v.currentTime = Math.min(v.duration - 0.1, v.currentTime + 0.5);
  }, 200);
}
function stopFF() {
  holding = false;
  if (ffTimer) { clearInterval(ffTimer); ffTimer = null; }
  const el = slotEls['0']; if (el) el.querySelector('.slide-media').classList.remove('ffwd');
}

/* ---------- slide construction ---------- */
function buildSlide(item, i) {
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.id = item.id;
  el.innerHTML =
    '<div class="slide-media">' +
      '<img alt="" decoding="async">' +
      '<div class="status-badge"><div class="spinner"></div></div>' +
      '<div class="mask-bottom"></div><div class="mask-rail"></div>' +
      '<div class="pause-icon">&#10074;&#10074;</div>' +
      '<div class="tap-icon">&#9654;</div>' +
    '</div>' +
    '<div class="slide-overlay">' +
      '<div class="slide-author"></div>' +
      '<div class="slide-desc"></div>' +
      '<div class="slide-title">' + esc(itemLabel(item)) + '</div>' +
      '<div class="slide-cat">' + esc(item.category) + '</div>' +
    '</div>' +
    '<div class="rail">' +
      '<button class="rail-btn mute-btn" aria-label="Sound">&#128263;</button>' +
      '<button class="rail-btn info-btn" aria-label="Info">&#8505;</button>' +
      '<button class="rail-btn share-btn" aria-label="Share">&#10148;</button>' +
      '<button class="rail-btn tag-btn2" aria-label="Organise">&#127991;</button>' +
    '</div>';
  const media = el.querySelector('.slide-media');
  bindThumb(el.querySelector('img'), item.id,
    () => Math.abs(i - curIndex),
    () => { el.classList.add('unavailable-slide');
            media.querySelector('.status-badge').textContent = 'Video unavailable'; });
  // rail buttons stop propagation so they don't start a drag
  el.querySelector('.tag-btn2').onpointerdown = (e) => e.stopPropagation();
  el.querySelector('.share-btn').onpointerdown = (e) => e.stopPropagation();
  el.querySelector('.mute-btn').onpointerdown = (e) => e.stopPropagation();
  el.querySelector('.info-btn').onpointerdown = (e) => e.stopPropagation();
  el.querySelector('.tag-btn2').onclick = (e) => { e.stopPropagation(); openCategorySheet(item); };
  el.querySelector('.share-btn').onclick = (e) => { e.stopPropagation(); shareVideo(item); };
  el.querySelector('.info-btn').onclick = (e) => { e.stopPropagation(); showInfo(item.id); };
  const mb = el.querySelector('.mute-btn');
  syncMuteBtn(mb);
  mb.onclick = (e) => {
    e.stopPropagation();
    desiredMuted = !desiredMuted;
    // This tap is a genuine user gesture. When turning sound ON, call play() on
    // ALL live slot videos synchronously here — that grants each pooled element
    // audio activation while the gesture is valid, so when you later swipe to a
    // preloaded neighbour it can play unmuted without a fresh tap. The pool
    // reuses these same activated elements, so the grant carries forward.
    if (!desiredMuted) {
      audioUnlocked = true;
      ['-1','0','1'].forEach(k => { const s = slotEls[k]; if (s && s._vid) { const p = s._vid.play(); if (p) p.catch(()=>{}); } });
    }
    const cur = slotEls['0'];
    if (cur && cur._vid) { cur._vid.muted = desiredMuted; if (!desiredMuted) { const p = cur._vid.play(); if (p) p.catch(()=>{}); } }
    ['-1','1'].forEach(k => { const s = slotEls[k]; if (s && s._vid) { s._vid.muted = true; s._vid.pause(); } });
    document.querySelectorAll('.mute-btn').forEach(syncMuteBtn);
  };
  // Tapping the caption expands/collapses it (long descriptions are clamped).
  const descEl = el.querySelector('.slide-desc');
  descEl.onpointerdown = (e) => e.stopPropagation();
  descEl.onclick = (e) => { e.stopPropagation(); descEl.classList.toggle('expanded'); };
  // Populate creator/description from whatever metadata we already have cached
  // (from a prior oEmbed thumbnail fetch or resolve); it fills in later otherwise.
  fillOverlay(el, item.id);
  return el;
}

// Metadata store (creator + description), populated as a side effect of the
// thumbnail oEmbed fetch and the video resolve. Persisted so it accrues across
// sessions and becomes the searchable index.
const _metaTS = trackedStore(legacyLoad('meta'));
let metaStore = _metaTS.obj;
const metaReady = hydrateTracked('meta', _metaTS, 'meta');
let metaDirty = false;
setInterval(() => { metaDirty = false; flushTracked('meta', _metaTS, 'meta'); }, 3000);
function metaSet(id, m) {
  const cur = metaStore[id] || {};
  const next = { author: m.author || cur.author, handle: m.handle || cur.handle, desc: (m.desc != null ? m.desc : cur.desc) };
  metaStore[id] = next; metaDirty = true;
  // If this video is on screen, reflect it immediately.
  document.querySelectorAll('.slide[data-id="' + CSS.escape(id) + '"]').forEach(el => fillOverlay(el, id));
}

// Background metadata HARVESTER — fills creator/description for the whole library
// so search actually finds videos you haven't opened. oEmbed tolerates rapid
// calls (unlike the play resolver), so this walks the list gently, skips what's
// already known, persists as it goes, and pauses while the feed is open so it
// never competes with playback.
let _harvestTimer = null, _harvestIdx = 0; const _harvestFailed = new Set();
let _harvestWaiting = false, _harvestBusy = false;
const HARVEST_TIMEOUT = 10000;   // whiskey: a request that never answers must not stall the indexer
const HARVEST_ENABLED = false;   // xray: TikTok's oEmbed no longer returns captions; indexing now happens as videos/thumbnails resolve
function startHarvest(){
  if (!HARVEST_ENABLED) return;
  if (_harvestTimer || _harvestWaiting || _harvestBusy) return;
  _harvestWaiting = true;
  metaReady.finally(() => { _harvestWaiting = false; if (_harvestTimer) return; _harvestIdx = 0; _harvestStep(); });
}
function _harvestStep(){
  _harvestTimer = null;
  if (!state || !state.items || !state.items.length) { _harvestTimer = setTimeout(_harvestStep, 3000); return; }
  if (document.getElementById('feed').classList.contains('open')) { _harvestTimer = setTimeout(_harvestStep, 1500); return; }
  const items = state.items;
  while (_harvestIdx < items.length) {
    const it = items[_harvestIdx];
    if (!metaStore[it.id] && !_harvestFailed.has(it.id)) break;
    _harvestIdx++;
  }
  if (_harvestIdx >= items.length) { _harvestIdx = 0; return; }   // done for now; re-kicked on demand
  const it = items[_harvestIdx];
  _harvestBusy = true;
  const hc = new AbortController(); const ht = setTimeout(() => hc.abort(), HARVEST_TIMEOUT);
  fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent('https://www.tiktok.com/@i/video/' + it.id), { signal: hc.signal })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      if (d && (d.author_name || d.title)) {
        let h = ''; const mm = /tiktok\.com\/@([^/?]+)/.exec(d.author_url || ''); if (mm) h = mm[1];
        metaSet(it.id, { author: d.author_name || '', handle: h || d.author_unique_id || '', desc: d.title || '' });
        if (d.thumbnail_url && !thumbCache[it.id]) { thumbCache[it.id] = { u: d.thumbnail_url, t: Date.now() }; cacheDirty = true; }
      } else { _harvestFailed.add(it.id); }
      _harvestIdx++;
    })
    .catch(() => { _harvestFailed.add(it.id); })
    .finally(() => { clearTimeout(ht); _harvestBusy = false; _harvestTimer = setTimeout(_harvestStep, 250); });
}
function fillOverlay(el, id) {
  const m = metaStore[id]; if (!m) return;
  const a = el.querySelector('.slide-author'); const d = el.querySelector('.slide-desc');
  if (a) a.textContent = m.author ? (m.handle ? m.author + '  ·  @' + m.handle : m.author) : (m.handle ? '@' + m.handle : '');
  if (d) d.textContent = m.desc || '';
}
// On-screen fallback for creator + description (the ⓘ rail button). Always

/* ============================================================
   PLAYER
   ============================================================ */
/* ============================================================
   PLAYER — native <video> + browser-side resolver.

   Replaces the TikTok player/v1 iframe. Each video ID is resolved to a direct
   MP4 URL by a free public resolver (called straight from the browser, CORS-
   open), then played in ONE persistent <video> element reused across slides.
   Reusing a single, gesture-unlocked element is what lets sound persist across
   swipes on iOS — a fresh element unmuted outside a gesture gets paused by the
   platform. el._state mirrors the old iframe states (1 playing / 2 paused /
   3 buffering / undefined none) so the debug overlay keeps working.
   ============================================================ */
const RESOLVER = 'https://www.tikwm.com/api/?url=';
const RESOLVE_TTL = 2 * 60 * 60 * 1000;   // fallback lifetime when a link's own expiry can't be read
const _rvMem = new Map();
// v2: a video link carries its expiry as a hex timestamp in its path (about 6 h, measured
// Nov 14 2026). Use it, minus 15 minutes so a video never starts on a link about to die.
function playExpiry(u){
  const m = /^https?:\/\/[^/]+\/[0-9a-f]{32}\/([0-9a-f]{8})\//.exec(u || ''); const x = m ? parseInt(m[1], 16) * 1000 : 0;
  return (x > Date.now() + 60000 && x < Date.now() + 48 * 3600e3) ? x : 0;
}
function rvFresh(r){ return !!r && Date.now() < (r.exp ? r.exp - 900000 : r.ts + RESOLVE_TTL); }
function cacheGet(id){ const r=_rvMem.get(String(id)); return rvFresh(r) ? r : null; }
function cacheSet(id,d){ const r={play:d.play,ts:Date.now(),exp:playExpiry(d.play)}; _rvMem.set(String(id),r); if (KV.ok) KV.write('rv', [[String(id), r]], []).catch(()=>{}); }

// Load fresh resolved URLs; move any old per-video localStorage keys over and delete them.
(async () => {
  const legacy = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('rv:')) legacy.push(k); } } catch (e) {}
  const now = Date.now(), puts = [];
  legacy.forEach(k => { try { const r = JSON.parse(localStorage.getItem(k)); if (r && now - r.ts < RESOLVE_TTL) { _rvMem.set(k.slice(3), r); puts.push([k.slice(3), r]); } } catch (e) {} });
  try {
    const all = await KV.getAll('rv'), stale = [];
    for (const k in all) { if (rvFresh(all[k])) { if (!_rvMem.has(k)) _rvMem.set(k, all[k]); } else stale.push(k); }
    await KV.write('rv', puts, stale);
    legacy.forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  } catch (e) {}
})();
// The free resolver hard-limits to ~1 request/second: spaced ~1.1s apart every
// call succeeds, but a burst gets rejected (code -1). So resolution runs through
// ONE rate-limited priority queue: the current video first, then near neighbours,
// then a small forward prefetch window; rejections retry with backoff; requests
// for videos you've scrolled away from are dropped so the ~1/sec budget always
// goes to what's on screen. Cold videos still cost ~1s each (a third-party
// ceiling), but nothing floods the resolver, so loads are reliable, not freezy.
// v2 (measured Nov 14 2026): the limit is on how close together calls START (a call 1.0 s
// after another is refused; 1.3 s is accepted even while the first is still in flight),
// a refusal costs 0.1 s and carries no penalty, and one call takes 0.5-2.5 s (2-7 s for a
// video the resolver can't find). So calls now start on a steady clock without waiting
// for the previous answer: a slow or dead video no longer holds up the one you tapped.
const MIN_GAP = 1150, MAX_FLIGHT = 4, RESOLVE_TIMEOUT = 12000;
let _queue = [];              // [{id, prio, tries}]
let _timer = null, _lastRes = 0, _lastOk = 0;
const _flying = new Set();    // ids with a call in flight
const _suspect = new Map();   // id -> time of a "can't find it" answer not yet confirmed
const _waiters = new Map();   // id -> [resolve fns]
const _thumbWaiters = new Map();   // xray: id -> [resolve fns] for thumbnail jobs (resolve with {cover} | null | 'dropped')
const THUMB_PRIO = 10;
function _emitThumb(id, val){ const ws=_thumbWaiters.get(id); if(ws){ _thumbWaiters.delete(id); ws.forEach(f=>f(val)); } }
function resolveForThumb(id){
  id = String(id);
  const p = new Promise(res => { const a=_thumbWaiters.get(id)||[]; a.push(res); _thumbWaiters.set(id,a); });
  if (!_flying.has(id) && !_queue.find(q => q.id === id)) _queue.push({ id, prio: THUMB_PRIO, tries: 0 });
  _pump();
  return p;
}
function cancelThumbResolve(id){
  id = String(id);

  _emitThumb(id, 'dropped');
}
function _emit(id, val, err){ const ws=_waiters.get(id); if(ws){ _waiters.delete(id); ws.forEach(w=> err? w.rej(err): w.res(val)); } }

function goneError(){ const e = new Error('gone'); e.gone = true; return e; }
function requestResolve(id, prio){
  const c = cacheGet(id); if (c) return Promise.resolve(c);
  id = String(id);

  const existing = _queue.find(q => q.id === id);
  if (existing) { if (prio < existing.prio) existing.prio = prio; }
  else if (!_flying.has(id)) _queue.push({ id, prio, tries: 0 });
  const p = new Promise((res, rej) => { const a=_waiters.get(id)||[]; a.push({res,rej}); _waiters.set(id,a); });

}
function _pump(){
  if (_timer || !_queue.length || _flying.size >= MAX_FLIGHT) return;
  _timer = setTimeout(() => { _timer = null; _fire(); _pump(); }, Math.max(0, MIN_GAP - (Date.now() - _lastRes)));
}
function _fire(){
  _queue.sort((a,b) => a.prio - b.prio);

  if (!job) return;
  const hit = cacheGet(job.id);
  if (hit && !_thumbWaiters.has(job.id)) { _emit(job.id, hit); return; }   // nothing sent, no wait owed
  _lastRes = Date.now(); _flying.add(job.id);

}
// A video the resolver says it can't find is remembered as gone only when (a) it said so
// twice and (b) the resolver was demonstrably working around then (another video succeeded
// within 2 minutes, before or after). A resolver outage must never brand the library.
function markGone(id){

}
async function _run(job){
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const to = setTimeout(() => { if (ac) ac.abort(); }, RESOLVE_TIMEOUT);

    const res = await fetch(RESOLVER + encodeURIComponent('https://www.tiktok.com/@i/video/' + job.id), ac ? { signal: ac.signal } : undefined);
    const j = await res.json();
    if (j.code !== 0 || !j.data || !j.data.play) { const e = new Error('code ' + (j.msg||j.code)); e.msg = String(j.msg || ''); throw e; }
    let play = j.data.play; if (play[0]==='/') play='https://www.tikwm.com'+play;
    const au = j.data.author || {};
    metaSet(job.id, { author: au.nickname || '', handle: au.unique_id || '', desc: j.data.title || '' });
    const out = { play }; cacheSet(job.id, out); _emit(job.id, out);
    let cover = j.data.cover || j.data.origin_cover || ''; if (cover && cover[0]==='/') cover='https://www.tikwm.com'+cover;
    if (cover && !_thumbWaiters.has(job.id) && !LIB.has(job.id)) LIB.saveCover(job.id, cover);   // keep the image even when only the video was wanted
    _emitThumb(job.id, { cover });

    _suspect.forEach((t, id) => { if (_lastOk - t < 120000) markGone(id); }); _suspect.clear();

    const msg = e && e.msg || '';

    else job.tries++;

      if (Date.now() - _lastOk < 120000) markGone(job.id);
      else { _suspect.set(job.id, Date.now()); _emit(job.id, null, e); _emitThumb(job.id, null); }
    } else {
      const thumbOnly = job.prio >= THUMB_PRIO && !_waiters.has(job.id);
      if (job.tries < (thumbOnly ? 2 : 5)) _queue.push(job);        // rate-limited/transient — retry later
      else { _emit(job.id, null, e); _emitThumb(job.id, null); }   // give up: waiters see rejection
    }

}
// Drop pending requests for videos no longer near the current index, so the
// rate budget isn't spent on things you've already scrolled past.
function pruneQueue(keepIds){ _queue = _queue.filter(q => { if (keepIds.has(q.id)) return true; _emitThumb(q.id, 'dropped'); return false; }); }
function clearResolveQueue(){ _queue.forEach(q => _emitThumb(q.id, 'dropped')); _queue = []; _waiters.clear(); }

// resolve(id, prio) — compatibility wrapper used by mountSlot.
function resolve(id, prio){ return requestResolve(id, prio == null ? 1 : prio); }
function prefetch(idx, prio){ const it = feedList[idx]; if (it && !cacheGet(it.id)) requestResolve(it.id, prio == null ? 4 : prio).catch(() => {}); }

/* ---- pool of reusable <video> elements (prev/current/next ring) ----
   The next clip is preloaded (src set, buffering, paused) so a swipe promotes
   an already-ready element instead of re-downloading — the fix for slow+freezy.
   Elements are REUSED (not recreated), so once the first unmute tap unlocks
   audio on them, sound keeps working across swipes.
   (audioUnlocked is declared once, up near desiredMuted.) */
const vpool = [];
function newVideo(){
  const v=document.createElement('video');
  v.playsInline=true; v.loop=true; v.muted=true; v.preload='auto';
  v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline',''); v.setAttribute('loop',''); v.setAttribute('muted','');
  const slideOf=()=>v.closest('.slide');
  // NOTE: we do NOT reveal the video (fade the thumbnail) on 'playing' — that
  // event can fire before an actual frame is painted, especially right after a
  // src swap, which showed as audio-over-black. Revealing is gated on a real
  // painted frame instead (see revealWhenPainted).
  v.addEventListener('playing',()=>{ const el=slideOf(); if(!el)return; el._state=1; const m=el.querySelector('.slide-media'); if(m) m.classList.remove('paused','needs-tap'); revealWhenPainted(el, v); });
  v.addEventListener('waiting',()=>{ const el=slideOf(); if(el&&el!==null) el._state=3; });
  v.addEventListener('pause',()=>{ const el=slideOf(); if(el&&el._state===1) el._state=2; });
  v.addEventListener('error',()=>{ const el=slideOf(); if(!el) return; el._state=undefined;
    // v2: links are now trusted for hours, so one that died early gets one fresh resolve before asking for a tap
    if (el._vidId && !el._retried) { el._retried = true; cacheDrop(el._vidId); el._vidId = null; mountSlot(el, slotEls['0']===el); return; }

}
// Reveal the video (fade out the thumbnail) only once a real frame of the

// over a still-black video and you get sound over a black screen. Uses
// requestVideoFrameCallback (fires on frame present) with a timeupdate fallback.
function revealWhenPainted(el, v){
  const media = el.querySelector('.slide-media'); if(!media) return;
  const tok = (el._revealTok = (el._revealTok||0) + 1);
  const show = () => { if(el._revealTok===tok && v.videoWidth>0) media.classList.add('is-playing'); };
  if(v.videoWidth>0 && v.readyState>=2 && v.currentTime>0){ media.classList.add('is-playing'); return; }
  if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
    const step = () => { if(el._revealTok!==tok) return; if(v.videoWidth>0){ show(); } else { try{ v.requestVideoFrameCallback(step); }catch(e){} } };
    try{ v.requestVideoFrameCallback(step); }catch(e){ show(); }

    const onT = () => { if(el._revealTok!==tok){ v.removeEventListener('timeupdate',onT); return; } if(v.videoWidth>0 && v.currentTime>0){ show(); v.removeEventListener('timeupdate',onT); } };

function acquireVideo(){ return vpool.pop() || newVideo(); }

// Called SYNCHRONOUSLY from the tap that opens the feed (a real user gesture),
// so the feed can start with sound ON. We pre-create the pooled <video>
// elements and play a tiny silent primer clip on each right now, inside the
// gesture — that grants each element audio activation, so when the real videos
// (which reuse these same elements) play unmuted, iOS allows it. If the platform
// still refuses, the current video falls back to muted playback (never frozen)
// and the sound button remains as manual override — so this can only help.
let audioPrimed = false;
function primeAudioOnGesture(){
  desiredMuted = false; audioUnlocked = true;

// Attach a pooled video to a slide, resolve+set its src (preload), and either
// play it (active) or leave it buffering+paused (neighbour).
function mountSlot(el, active){
  if(!el || el.classList.contains('unavailable-slide')) return;
  const media=el.querySelector('.slide-media'); if(!media) return;
  if(!el._vid){ el._vid=acquireVideo(); media.appendChild(el._vid); media.classList.add('has-player'); }
  const v=el._vid, id=el.dataset.id;
  const applyState=()=>{
    media.classList.remove('resolving');
    if(active){
      v.muted = desiredMuted || !audioUnlocked;
      const p=v.play(); if(p)p.catch(()=>{});

      // paused shortly after), fall back to muted playback so it never freezes.
      if(!v.muted){
        setTimeout(()=>{ if(slotEls['0']===el && el.dataset.userPaused!=='true' && v.paused){ v.muted=true; const q=v.play(); if(q)q.catch(()=>{}); } }, 900);

    el._vidId=id; applyState();

    if (e && e.gone) {                       // v2: remembered as unavailable; a tap re-checks
      unmountSlot(el); el.classList.add('unavailable-slide');

function unmountSlot(el){

  if(el._vid){ releaseVideo(el._vid); el._vid=null; el._vidId=null; }
  const m=el.querySelector('.slide-media'); if(m) m.classList.remove('has-player','paused','needs-tap','is-playing');

}
// Keep the old names the rest of the app calls:
function destroyPlayer(el){ unmountSlot(el); }
function createPlayer(el){ mountSlot(el, slotEls['0']===el); return el && el._vid; }
function pauseSlide(el){ if(el && el._vid){ el._vid.pause(); if(el._state===1) el._state=2; } if(el&&el._playGrace){clearTimeout(el._playGrace);el._playGrace=null;} }

// Mount current (playing) + both neighbours (preloaded, paused), and gently
// prefetch a few videos AHEAD so normal forward scrolling stays supplied by the
// ~1/sec resolver. Prune the queue to just this neighbourhood so the rate budget
// isn't wasted on videos already scrolled past.
function syncSlots(){
  if(slotEls['0']) mountSlot(slotEls['0'], true);
  ['-1','1'].forEach(k=>{ if(slotEls[k]) mountSlot(slotEls[k], false); });
  const keep = new Set();
  const cur = slotEls['0']; if(cur) keep.add(cur.dataset.id);
  ['-1','1'].forEach(k=>{ if(slotEls[k]) keep.add(slotEls[k].dataset.id); });
  for(let d=2; d<=4; d++){ const it=feedList[curIndex+d]; if(it){ keep.add(it.id); prefetch(curIndex+d, 3+d); } }
  const back=feedList[curIndex-2]; if(back){ keep.add(back.id); prefetch(curIndex-2, 8); }
  pruneQueue(keep);
}

// Native playback needs no polling; just a grace timer that surfaces a
// tap-to-play prompt if autoplay was genuinely refused.
function ensurePlaying(el){
  if(!el || el.classList.contains('unavailable-slide')) return;
  const media=el.querySelector('.slide-media'); if(media) media.classList.remove('needs-tap','paused');
  delete el.dataset.userPaused;
  if(el._playGrace) clearTimeout(el._playGrace);
  el._playGrace=setTimeout(()=>{
    if(slotEls['0']!==el || el.dataset.userPaused==='true' || el._state===1) return;
    const v=el._vid;
    if(v && v.paused){ v.muted=desiredMuted||!audioUnlocked; const p=v.play(); if(p)p.catch(()=>{}); }
    if(el._state!==1 && media) media.classList.add('needs-tap');

// Set mute on the current video — called from the mute-button tap (a real
// gesture) so unmuting sticks on iOS.
function applySound(el){
  if(!el || !el._vid) return;
  el._vid.muted=desiredMuted; el._muted=el._vid.muted;
  if(!desiredMuted){ const p=el._vid.play(); if(p)p.catch(()=>{}); }
}

/* ============================================================
   PER-VIDEO SHEET: categories, delete, restore, purge
